게 읽고 방법을 조정합니다. 복잡한 상황에서도 자연스럽게 방향을 바꿀 수 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 구체, 통합, 명료, 유연입니다. ‘차분한 현실 조정자’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","막연한 요구를 실제 일정과 자원, 순서, 결과물로 바꿉니다. 바로 실행할 수 있는 형태가 만들어집니다.","흩어진 신호를 앞뒤 상황과 이어 봅니다. 큰 흐름과 핵심 의미를 빠르게 잡아냅니다.","핵심 메시지와 기대 수준을 분명하게 전달합니다. 오해가 줄고 판단도 빨라집니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","전체 흐름의 변화를 빠르게 읽고 방법을 조정합니다. 복잡한 상황에서도 자연스럽게 방향을 바꿀 수 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 목표가 실제로 어떤 모습이 될지 필요한 자원과 단계, 완성된 모습을 먼저 그려 보는 편입니다. 일 전체의 목적과 관계, 흐름을 먼저 보고 서로 이어지는 지점을 찾는 편입니다. 역할과 해야 할 일, 결론, 다음 행동을 분명한 말로 정리하는 편입니다. 실제 상황에 맞춰 방법과 우선순위를 조정하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 흐름 속에서 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 생각과 기대를 직접 표현해 서로 짐작해야 하는 부분을 줄이는 편입니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 구체의 사고 접근을 자연스럽게 더합니다. 판단은 통합, 관계는 명료, 운영은 유연의 방식으로 일관되게 이어 갑니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","아이디어를 실제 과정과 결과물로 만들어야 하는 실무 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","해야 할 일과 책임, 결정 사항을 분명하게 정리해야 하는 상황","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.","유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 지금 조건 너머의 다른 방법과 가능성을 열어 줍니다. 현실적인 계획에 새로운 선택지가 더해집니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.",matureStrength:"현실감을 지키면서 새로운 대안을 받아들여 더 나은 형태로 만들어 내는 힘"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 크게 잡은 흐름을 근거와 순서로 확인해 줍니다. 다른 사람도 같은 결론에 이를 수 있게 됩니다.",overuseSignal:"전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤에는 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 두면 도움이 됩니다.",matureStrength:"큰 그림을 보면서도 필요한 근거와 짜임새를 분명히 제시하는 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 말도 상대의 상태와 관계의 흐름에 맞게 전하도록 도와줍니다. 분명한 말이 더 잘 받아들여집니다.",overuseSignal:"명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.",practice:"중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.",matureStrength:"핵심을 분명히 전하면서도 상대가 받아들일 수 있는 방식으로 맞추는 소통력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 지켜 줍니다. 유연함에 흔들리지 않는 중심이 생깁니다.",overuseSignal:"유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.",practice:"상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 명료에 공감을, 운영에서는 유연에 원칙을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","구체 에너지를 지나치게 쓰고 있다고 느껴지면 창의 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.","명료 에너지를 지나치게 쓰고 있다고 느껴지면 공감 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.","유연 에너지를 지나치게 쓰고 있다고 느껴지면 원칙 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 구체와 창의 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 더하면 전달과 이해가 더 좋아지는가?","지금의 유연 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 구체, 통합, 명료, 유연 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 창의, 분석, 공감, 원칙 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-0-0-0-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 구체 × 통합 × 명료 × 유연” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다.",legacyPersonaName:"유연한 가능성 탐색가"},{typeNumber:2,bitString:"000001",code:"0-0-0-0-0-1",typeName:"숙고·자율·구체·통합·명료·원칙형",personaName:"든든한 원칙의 수호자",energySignature:"숙고 × 자율 × 구체 × 통합 × 명료 × 원칙",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 아이디어를 실제 모습으로 만듭니다. 전체를 이어 보고, 생각을 분명히 말하고 정한 기준을 지킵니다.",preferredEnergies:["숙고","자율","구체","통합","명료","원칙"],supportingEnergies:["추진","조율","창의","분석","공감","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 아이디어와 목표를 실제 조건에 맞는 결과물로 만들어 갑니다. 여러 정보를 앞뒤 상황과 이어 보며 전체 그림을 읽습니다. 생각과 기준을 분명한 말로 표현합니다. 그래서 관계와 일에서 애매한 부분이 줄어듭니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 전체 흐름과 핵심 기준, 약속을 함께 살핍니다. 큰 방향과 안정감을 동시에 지킬 수 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 구체, 통합, 명료, 원칙입니다. ‘든든한 원칙의 수호자’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","막연한 요구를 실제 일정과 자원, 순서, 결과물로 바꿉니다. 바로 실행할 수 있는 형태가 만들어집니다.","흩어진 신호를 앞뒤 상황과 이어 봅니다. 큰 흐름과 핵심 의미를 빠르게 잡아냅니다.","핵심 메시지와 기대 수준을 분명하게 전달합니다. 오해가 줄고 판단도 빨라집니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","전체 흐름과 핵심 기준, 약속을 함께 살핍니다. 큰 방향과 안정감을 동시에 지킬 수 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 목표가 실제로 어떤 모습이 될지 필요한 자원과 단계, 완성된 모습을 먼저 그려 보는 편입니다. 일 전체의 목적과 관계, 흐름을 먼저 보고 서로 이어지는 지점을 찾는 편입니다. 역할과 해야 할 일, 결론, 다음 행동을 분명한 말로 정리하는 편입니다. 일정과 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 마무리하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 흐름 속에서 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 생각과 기대를 직접 표현해 서로 짐작해야 하는 부분을 줄이는 편입니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 구체의 사고 접근을 자연스럽게 더합니다. 판단은 통합, 관계는 명료, 운영은 원칙의 방식으로 일관되게 이어 갑니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","아이디어를 실제 과정과 결과물로 만들어야 하는 실무 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","해야 할 일과 책임, 결정 사항을 분명하게 정리해야 하는 상황","일정, 품질, 기준과 책임을 안정적으로 관리해야 하는 운영 과제"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.","원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 지금 조건 너머의 다른 방법과 가능성을 열어 줍니다. 현실적인 계획에 새로운 선택지가 더해집니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.",matureStrength:"현실감을 지키면서 새로운 대안을 받아들여 더 나은 형태로 만들어 내는 힘"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 크게 잡은 흐름을 근거와 순서로 확인해 줍니다. 다른 사람도 같은 결론에 이를 수 있게 됩니다.",overuseSignal:"전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤에는 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 두면 도움이 됩니다.",matureStrength:"큰 그림을 보면서도 필요한 근거와 짜임새를 분명히 제시하는 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 말도 상대의 상태와 관계의 흐름에 맞게 전하도록 도와줍니다. 분명한 말이 더 잘 받아들여집니다.",overuseSignal:"명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.",practice:"중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.",matureStrength:"핵심을 분명히 전하면서도 상대가 받아들일 수 있는 방식으로 맞추는 소통력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연함은 핵심 기준을 지키면서 방법과 순서를 현실에 맞게 바꾸게 해 줍니다. 원칙에 적응하는 힘이 더해집니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 나누어 두면 도움이 됩니다.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 명료에 공감을, 운영에서는 원칙에 유연을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","구체 에너지를 지나치게 쓰고 있다고 느껴지면 창의 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.","명료 에너지를 지나치게 쓰고 있다고 느껴지면 공감 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.","원칙 에너지를 지나치게 쓰고 있다고 느껴지면 유연 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 나누어 두면 도움이 됩니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 구체와 창의 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 더하면 전달과 이해가 더 좋아지는가?","지금의 원칙 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 구체, 통합, 명료, 원칙 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 창의, 분석, 공감, 유연 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-0-0-0-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 구체 × 통합 × 명료 × 원칙” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다.",legacyPersonaName:"차분한 기준 수호자"},{typeNumber:3,bitString:"000010",code:"0-0-0-0-1-0",typeName:"숙고·자율·구체·통합·공감·유연형",personaName:"다정한 마음의 동반자",energySignature:"숙고 × 자율 × 구체 × 통합 × 공감 × 유연",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 아이디어를 실제 모습으로 만듭니다. 전체를 이어 보고, 마음을 살피며 상황에 맞게 바꿉니다.",preferredEnergies:["숙고","자율","구체","통합","공감","유연"],supportingEnergies:["추진","조율","창의","분석","명료","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:1,preferredEnergy:"공감",supportingEnergy:"명료",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 아이디어와 목표를 실제 조건에 맞는 결과물로 만들어 갑니다. 여러 정보를 앞뒤 상황과 이어 보며 전체 그림을 읽습니다. 상대의 감정과 필요를 세심하게 읽습니다. 그래서 사람들이 마음 놓고 이야기할 수 있는 분위기가 만들어집니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 전체 흐름의 변화를 빠르게 읽고 방법을 조정합니다. 복잡한 상황에서도 자연스럽게 방향을 바꿀 수 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 구체, 통합, 공감, 유연입니다. ‘다정한 마음의 동반자’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","막연한 요구를 실제 일정과 자원, 순서, 결과물로 바꿉니다. 바로 실행할 수 있는 형태가 만들어집니다.","흩어진 신호를 앞뒤 상황과 이어 봅니다. 큰 흐름과 핵심 의미를 빠르게 잡아냅니다.","말의 내용과 감정, 분위기를 함께 살펴 상대가 충분히 이해받는다고 느끼도록 반응합니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다.","자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다.","전체 흐름의 변화를 빠르게 읽고 방법을 조정합니다. 복잡한 상황에서도 자연스럽게 방향을 바꿀 수 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 목표가 실제로 어떤 모습이 될지 필요한 자원과 단계, 완성된 모습을 먼저 그려 보는 편입니다. 일 전체의 목적과 관계, 흐름을 먼저 보고 서로 이어지는 지점을 찾는 편입니다. 사람마다 받아들이는 속도와 마음의 부담을 헤아려 협력이 이어지도록 관계를 살피는 편입니다. 실제 상황에 맞춰 방법과 우선순위를 조정하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 흐름 속에서 판단합니다. 결정이 사람에게 미칠 경험과 감정적 영향을 함께 고려합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 충분히 듣고 감정을 확인하며 상대가 편하게 자신을 표현할 수 있는 분위기를 만듭니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","공감 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 구체의 사고 접근을 자연스럽게 더합니다. 판단은 통합, 관계는 공감, 운영은 유연의 방식으로 일관되게 이어 갑니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","아이디어를 실제 과정과 결과물로 만들어야 하는 실무 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","사람의 경험, 관계, 수용성이 결과의 질에 중요한 과제","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.","공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다.","유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 지금 조건 너머의 다른 방법과 가능성을 열어 줍니다. 현실적인 계획에 새로운 선택지가 더해집니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.",matureStrength:"현실감을 지키면서 새로운 대안을 받아들여 더 나은 형태로 만들어 내는 힘"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 크게 잡은 흐름을 근거와 순서로 확인해 줍니다. 다른 사람도 같은 결론에 이를 수 있게 됩니다.",overuseSignal:"전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤에는 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 두면 도움이 됩니다.",matureStrength:"큰 그림을 보면서도 필요한 근거와 짜임새를 분명히 제시하는 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료함은 상대를 배려하면서도 자신의 생각과 기대, 선을 분명히 전하게 합니다. 공감에 건강한 경계가 더해집니다.",overuseSignal:"공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현하는 것이 도움이 됩니다.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 지켜 줍니다. 유연함에 흔들리지 않는 중심이 생깁니다.",overuseSignal:"유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.",practice:"상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 공감에 명료를, 운영에서는 유연에 원칙을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","구체 에너지를 지나치게 쓰고 있다고 느껴지면 창의 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.","공감 에너지를 지나치게 쓰고 있다고 느껴지면 명료 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현하는 것이 도움이 됩니다.","유연 에너지를 지나치게 쓰고 있다고 느껴지면 원칙 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 구체와 창의 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료를 더하면 전달과 이해가 더 좋아지는가?","지금의 유연 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 구체, 통합, 공감, 유연 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 창의, 분석, 명료, 원칙 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-0-0-1-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 구체 × 통합 × 공감 × 유연” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다.",legacyPersonaName:"다정한 마음 동반자"},{typeNumber:4,bitString:"000011",code:"0-0-0-0-1-1",typeName:"숙고·자율·구체·통합·공감·원칙형",personaName:"마음을 돌보는 정원사",energySignature:"숙고 × 자율 × 구체 × 통합 × 공감 × 원칙",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 아이디어를 실제 모습으로 만듭니다. 전체를 이어 보고, 마음을 살피며 정한 기준을 지킵니다.",preferredEnergies:["숙고","자율","구체","통합","공감","원칙"],supportingEnergies:["추진","조율","창의","분석","명료","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:1,preferredEnergy:"공감",supportingEnergy:"명료",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 아이디어와 목표를 실제 조건에 맞는 결과물로 만들어 갑니다. 여러 정보를 앞뒤 상황과 이어 보며 전체 그림을 읽습니다. 상대의 감정과 필요를 세심하게 읽습니다. 그래서 사람들이 마음 놓고 이야기할 수 있는 분위기가 만들어집니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 전체 흐름과 핵심 기준, 약속을 함께 살핍니다. 큰 방향과 안정감을 동시에 지킬 수 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 구체, 통합, 공감, 원칙입니다. ‘마음을 돌보는 정원사’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","막연한 요구를 실제 일정과 자원, 순서, 결과물로 바꿉니다. 바로 실행할 수 있는 형태가 만들어집니다.","흩어진 신호를 앞뒤 상황과 이어 봅니다. 큰 흐름과 핵심 의미를 빠르게 잡아냅니다.","말의 내용과 감정, 분위기를 함께 살펴 상대가 충분히 이해받는다고 느끼도록 반응합니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다.","자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다.","전체 흐름과 핵심 기준, 약속을 함께 살핍니다. 큰 방향과 안정감을 동시에 지킬 수 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 목표가 실제로 어떤 모습이 될지 필요한 자원과 단계, 완성된 모습을 먼저 그려 보는 편입니다. 일 전체의 목적과 관계, 흐름을 먼저 보고 서로 이어지는 지점을 찾는 편입니다. 사람마다 받아들이는 속도와 마음의 부담을 헤아려 협력이 이어지도록 관계를 살피는 편입니다. 일정과 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 마무리하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 흐름 속에서 판단합니다. 결정이 사람에게 미칠 경험과 감정적 영향을 함께 고려합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 충분히 듣고 감정을 확인하며 상대가 편하게 자신을 표현할 수 있는 분위기를 만듭니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","공감 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 구체의 사고 접근을 자연스럽게 더합니다. 판단은 통합, 관계는 공감, 운영은 원칙의 방식으로 일관되게 이어 갑니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","아이디어를 실제 과정과 결과물로 만들어야 하는 실무 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","사람의 경험, 관계, 수용성이 결과의 질에 중요한 과제","일정, 품질, 기준과 책임을 안정적으로 관리해야 하는 운영 과제"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.","공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다.","원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 지금 조건 너머의 다른 방법과 가능성을 열어 줍니다. 현실적인 계획에 새로운 선택지가 더해집니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.",matureStrength:"현실감을 지키면서 새로운 대안을 받아들여 더 나은 형태로 만들어 내는 힘"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 크게 잡은 흐름을 근거와 순서로 확인해 줍니다. 다른 사람도 같은 결론에 이를 수 있게 됩니다.",overuseSignal:"전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤에는 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 두면 도움이 됩니다.",matureStrength:"큰 그림을 보면서도 필요한 근거와 짜임새를 분명히 제시하는 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료함은 상대를 배려하면서도 자신의 생각과 기대, 선을 분명히 전하게 합니다. 공감에 건강한 경계가 더해집니다.",overuseSignal:"공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현하는 것이 도움이 됩니다.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연함은 핵심 기준을 지키면서 방법과 순서를 현실에 맞게 바꾸게 해 줍니다. 원칙에 적응하는 힘이 더해집니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 나누어 두면 도움이 됩니다.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 공감에 명료를, 운영에서는 원칙에 유연을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","구체 에너지를 지나치게 쓰고 있다고 느껴지면 창의 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.","공감 에너지를 지나치게 쓰고 있다고 느껴지면 명료 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현하는 것이 도움이 됩니다.","원칙 에너지를 지나치게 쓰고 있다고 느껴지면 유연 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 나누어 두면 도움이 됩니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 구체와 창의 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료를 더하면 전달과 이해가 더 좋아지는가?","지금의 원칙 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 구체, 통합, 공감, 원칙 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 창의, 분석, 명료, 유연 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-0-0-1-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 구체 × 통합 × 공감 × 원칙” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다.",legacyPersonaName:"믿음을 쌓는 돌봄 실천가"},{typeNumber:5,bitString:"000100",code:"0-0-0-1-0-0",typeName:"숙고·자율·구체·분석·명료·유연형",personaName:"정교한 사실 탐구자",energySignature:"숙고 × 자율 × 구체 × 분석 × 명료 × 유연",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 아이디어를 실제 모습으로 만듭니다. 하나씩 따져보고, 생각을 분명히 말하고 상황에 맞게 바꿉니다.",preferredEnergies:["숙고","자율","구체","분석","명료","유연"],supportingEnergies:["추진","조율","창의","통합","공감","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:1,preferredEnergy:"분석",supportingEnergy:"통합",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 아이디어와 목표를 실제 조건에 맞는 결과물로 만들어 갑니다. 정보를 나누고 근거를 비교해 문제가 어떻게 얽혀 있는지 선명하게 봅니다. 생각과 기준을 분명한 말로 표현합니다. 그래서 관계와 일에서 애매한 부분이 줄어듭니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 근거를 확인하면서도 상황이 바뀌면 방법을 고칩니다. 정확함과 적응력을 함께 지킬 수 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 구체, 분석, 명료, 유연입니다. ‘정교한 사실 탐구자’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","막연한 요구를 실제 일정과 자원, 순서, 결과물로 바꿉니다. 바로 실행할 수 있는 형태가 만들어집니다.","사실과 가정, 원인을 구분하고 자료를 비교합니다. 판단이 정확해지고 다른 사람에게 설명하기도 쉬워집니다.","핵심 메시지와 기대 수준을 분명하게 전달합니다. 오해가 줄고 판단도 빨라집니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","근거를 확인하면서도 상황이 바뀌면 방법을 고칩니다. 정확함과 적응력을 함께 지킬 수 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 목표가 실제로 어떤 모습이 될지 필요한 자원과 단계, 완성된 모습을 먼저 그려 보는 편입니다. 복잡한 문제를 부분으로 나누고 판단 기준과 근거를 정리한 뒤 다가가는 편입니다. 역할과 해야 할 일, 결론, 다음 행동을 분명한 말로 정리하는 편입니다. 실제 상황에 맞춰 방법과 우선순위를 조정하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 자료와 조건, 위험, 원인과 결과의 연결을 비교해 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 생각과 기대를 직접 표현해 서로 짐작해야 하는 부분을 줄이는 편입니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","분석 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 구체의 사고 접근을 자연스럽게 더합니다. 판단은 분석, 관계는 명료, 운영은 유연의 방식으로 일관되게 이어 갑니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","아이디어를 실제 과정과 결과물로 만들어야 하는 실무 과제","복잡한 정보와 원인을 나누어 정리하고 확인해야 하는 문제 해결 과제","해야 할 일과 책임, 결정 사항을 분명하게 정리해야 하는 상황","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","분석이 지나치면 숫자로 설명하기 어려운 분위기나 전체 흐름을 놓칠 수 있습니다. 판단에 걸리는 시간도 길어집니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.","유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 지금 조건 너머의 다른 방법과 가능성을 열어 줍니다. 현실적인 계획에 새로운 선택지가 더해집니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.",matureStrength:"현실감을 지키면서 새로운 대안을 받아들여 더 나은 형태로 만들어 내는 힘"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 낱낱의 정보가 전체 속에서 어떤 뜻을 갖는지 이어 줍니다. 분석한 결과가 전체 목표와 연결됩니다.",overuseSignal:"분석이 지나치면 숫자로 설명하기 어려운 분위기나 전체 흐름을 놓칠 수 있습니다. 판단에 걸리는 시간도 길어집니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 뜻하는가”를 한 문장으로 다시 정리하면 도움이 됩니다.",matureStrength:"정확한 근거와 전체 흐름을 함께 잇는 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 말도 상대의 상태와 관계의 흐름에 맞게 전하도록 도와줍니다. 분명한 말이 더 잘 받아들여집니다.",overuseSignal:"명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.",practice:"중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.",matureStrength:"핵심을 분명히 전하면서도 상대가 받아들일 수 있는 방식으로 맞추는 소통력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 지켜 줍니다. 유연함에 흔들리지 않는 중심이 생깁니다.",overuseSignal:"유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.",practice:"상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 명료에 공감을, 운영에서는 유연에 원칙을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","구체 에너지를 지나치게 쓰고 있다고 느껴지면 창의 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.","명료 에너지를 지나치게 쓰고 있다고 느껴지면 공감 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.","유연 에너지를 지나치게 쓰고 있다고 느껴지면 원칙 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 구체와 창의 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 더하면 전달과 이해가 더 좋아지는가?","지금의 유연 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 구체, 분석, 명료, 유연 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 창의, 통합, 공감, 원칙 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-0-1-0-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 구체 × 분석 × 명료 × 유연” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다."},{typeNumber:6,bitString:"000101",code:"0-0-0-1-0-1",typeName:"숙고·자율·구체·분석·명료·원칙형",personaName:"질서를 만드는 설계자",energySignature:"숙고 × 자율 × 구체 × 분석 × 명료 × 원칙",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 아이디어를 실제 모습으로 만듭니다. 하나씩 따져보고, 생각을 분명히 말하고 정한 기준을 지킵니다.",preferredEnergies:["숙고","자율","구체","분석","명료","원칙"],supportingEnergies:["추진","조율","창의","통합","공감","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:1,preferredEnergy:"분석",supportingEnergy:"통합",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 아이디어와 목표를 실제 조건에 맞는 결과물로 만들어 갑니다. 정보를 나누고 근거를 비교해 문제가 어떻게 얽혀 있는지 선명하게 봅니다. 생각과 기준을 분명한 말로 표현합니다. 그래서 관계와 일에서 애매한 부분이 줄어듭니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 근거와 기준을 함께 쓰기 때문에 잘못이 적고 반복할 수 있는 판단과 운영 방식을 만드는 데 강점이 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 구체, 분석, 명료, 원칙입니다. ‘질서를 만드는 설계자’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","막연한 요구를 실제 일정과 자원, 순서, 결과물로 바꿉니다. 바로 실행할 수 있는 형태가 만들어집니다.","사실과 가정, 원인을 구분하고 자료를 비교합니다. 판단이 정확해지고 다른 사람에게 설명하기도 쉬워집니다.","핵심 메시지와 기대 수준을 분명하게 전달합니다. 오해가 줄고 판단도 빨라집니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","근거와 기준을 함께 쓰기 때문에 잘못이 적고 반복할 수 있는 판단과 운영 방식을 만드는 데 강점이 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 목표가 실제로 어떤 모습이 될지 필요한 자원과 단계, 완성된 모습을 먼저 그려 보는 편입니다. 복잡한 문제를 부분으로 나누고 판단 기준과 근거를 정리한 뒤 다가가는 편입니다. 역할과 해야 할 일, 결론, 다음 행동을 분명한 말로 정리하는 편입니다. 일정과 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 마무리하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 자료와 조건, 위험, 원인과 결과의 연결을 비교해 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 생각과 기대를 직접 표현해 서로 짐작해야 하는 부분을 줄이는 편입니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","분석 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 구체의 사고 접근을 자연스럽게 더합니다. 판단은 분석, 관계는 명료, 운영은 원칙의 방식으로 일관되게 이어 갑니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","아이디어를 실제 과정과 결과물로 만들어야 하는 실무 과제","복잡한 정보와 원인을 나누어 정리하고 확인해야 하는 문제 해결 과제","해야 할 일과 책임, 결정 사항을 분명하게 정리해야 하는 상황","일정, 품질, 기준과 책임을 안정적으로 관리해야 하는 운영 과제"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","분석이 지나치면 숫자로 설명하기 어려운 분위기나 전체 흐름을 놓칠 수 있습니다. 판단에 걸리는 시간도 길어집니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.","원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 지금 조건 너머의 다른 방법과 가능성을 열어 줍니다. 현실적인 계획에 새로운 선택지가 더해집니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.",matureStrength:"현실감을 지키면서 새로운 대안을 받아들여 더 나은 형태로 만들어 내는 힘"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 낱낱의 정보가 전체 속에서 어떤 뜻을 갖는지 이어 줍니다. 분석한 결과가 전체 목표와 연결됩니다.",overuseSignal:"분석이 지나치면 숫자로 설명하기 어려운 분위기나 전체 흐름을 놓칠 수 있습니다. 판단에 걸리는 시간도 길어집니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 뜻하는가”를 한 문장으로 다시 정리하면 도움이 됩니다.",matureStrength:"정확한 근거와 전체 흐름을 함께 잇는 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 말도 상대의 상태와 관계의 흐름에 맞게 전하도록 도와줍니다. 분명한 말이 더 잘 받아들여집니다.",overuseSignal:"명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.",practice:"중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.",matureStrength:"핵심을 분명히 전하면서도 상대가 받아들일 수 있는 방식으로 맞추는 소통력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연함은 핵심 기준을 지키면서 방법과 순서를 현실에 맞게 바꾸게 해 줍니다. 원칙에 적응하는 힘이 더해집니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 나누어 두면 도움이 됩니다.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 명료에 공감을, 운영에서는 원칙에 유연을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","구체 에너지를 지나치게 쓰고 있다고 느껴지면 창의 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.","명료 에너지를 지나치게 쓰고 있다고 느껴지면 공감 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.","원칙 에너지를 지나치게 쓰고 있다고 느껴지면 유연 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 나누어 두면 도움이 됩니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 구체와 창의 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 더하면 전달과 이해가 더 좋아지는가?","지금의 원칙 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 구체, 분석, 명료, 원칙 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 창의, 통합, 공감, 유연 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-0-1-0-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 구체 × 분석 × 명료 × 원칙” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다.",legacyPersonaName:"정확한 체계 설계자"},{typeNumber:7,bitString:"000110",code:"0-0-0-1-1-0",typeName:"숙고·자율·구체·분석·공감·유연형",personaName:"사람을 읽는 분석가",energySignature:"숙고 × 자율 × 구체 × 분석 × 공감 × 유연",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 아이디어를 실제 모습으로 만듭니다. 하나씩 따져보고, 마음을 살피며 상황에 맞게 바꿉니다.",preferredEnergies:["숙고","자율","구체","분석","공감","유연"],supportingEnergies:["추진","조율","창의","통합","명료","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:1,preferredEnergy:"분석",supportingEnergy:"통합",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:1,preferredEnergy:"공감",supportingEnergy:"명료",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 아이디어와 목표를 실제 조건에 맞는 결과물로 만들어 갑니다. 정보를 나누고 근거를 비교해 문제가 어떻게 얽혀 있는지 선명하게 봅니다. 상대의 감정과 필요를 세심하게 읽습니다. 그래서 사람들이 마음 놓고 이야기할 수 있는 분위기가 만들어집니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 근거를 확인하면서도 상황이 바뀌면 방법을 고칩니다. 정확함과 적응력을 함께 지킬 수 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 구체, 분석, 공감, 유연입니다. ‘사람을 읽는 분석가’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","막연한 요구를 실제 일정과 자원, 순서, 결과물로 바꿉니다. 바로 실행할 수 있는 형태가 만들어집니다.","사실과 가정, 원인을 구분하고 자료를 비교합니다. 판단이 정확해지고 다른 사람에게 설명하기도 쉬워집니다.","말의 내용과 감정, 분위기를 함께 살펴 상대가 충분히 이해받는다고 느끼도록 반응합니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다.","자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다.","근거를 확인하면서도 상황이 바뀌면 방법을 고칩니다. 정확함과 적응력을 함께 지킬 수 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 목표가 실제로 어떤 모습이 될지 필요한 자원과 단계, 완성된 모습을 먼저 그려 보는 편입니다. 복잡한 문제를 부분으로 나누고 판단 기준과 근거를 정리한 뒤 다가가는 편입니다. 사람마다 받아들이는 속도와 마음의 부담을 헤아려 협력이 이어지도록 관계를 살피는 편입니다. 실제 상황에 맞춰 방법과 우선순위를 조정하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 자료와 조건, 위험, 원인과 결과의 연결을 비교해 판단합니다. 결정이 사람에게 미칠 경험과 감정적 영향을 함께 고려합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 충분히 듣고 감정을 확인하며 상대가 편하게 자신을 표현할 수 있는 분위기를 만듭니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","분석 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","공감 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 구체의 사고 접근을 자연스럽게 더합니다. 판단은 분석, 관계는 공감, 운영은 유연의 방식으로 일관되게 이어 갑니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","아이디어를 실제 과정과 결과물로 만들어야 하는 실무 과제","복잡한 정보와 원인을 나누어 정리하고 확인해야 하는 문제 해결 과제","사람의 경험, 관계, 수용성이 결과의 질에 중요한 과제","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","분석이 지나치면 숫자로 설명하기 어려운 분위기나 전체 흐름을 놓칠 수 있습니다. 판단에 걸리는 시간도 길어집니다.","공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다.","유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 지금 조건 너머의 다른 방법과 가능성을 열어 줍니다. 현실적인 계획에 새로운 선택지가 더해집니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.",matureStrength:"현실감을 지키면서 새로운 대안을 받아들여 더 나은 형태로 만들어 내는 힘"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 낱낱의 정보가 전체 속에서 어떤 뜻을 갖는지 이어 줍니다. 분석한 결과가 전체 목표와 연결됩니다.",overuseSignal:"분석이 지나치면 숫자로 설명하기 어려운 분위기나 전체 흐름을 놓칠 수 있습니다. 판단에 걸리는 시간도 길어집니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 뜻하는가”를 한 문장으로 다시 정리하면 도움이 됩니다.",matureStrength:"정확한 근거와 전체 흐름을 함께 잇는 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료함은 상대를 배려하면서도 자신의 생각과 기대, 선을 분명히 전하게 합니다. 공감에 건강한 경계가 더해집니다.",overuseSignal:"공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현하는 것이 도움이 됩니다.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 지켜 줍니다. 유연함에 흔들리지 않는 중심이 생깁니다.",overuseSignal:"유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.",practice:"상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 공감에 명료를, 운영에서는 유연에 원칙을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","구체 에너지를 지나치게 쓰고 있다고 느껴지면 창의 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.","공감 에너지를 지나치게 쓰고 있다고 느껴지면 명료 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현하는 것이 도움이 됩니다.","유연 에너지를 지나치게 쓰고 있다고 느껴지면 원칙 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 구체와 창의 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료를 더하면 전달과 이해가 더 좋아지는가?","지금의 유연 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 구체, 분석, 공감, 유연 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 창의, 통합, 명료, 원칙 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-0-1-1-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 구체 × 분석 × 공감 × 유연” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다.",legacyPersonaName:"사람을 읽는 이해 분석가"},{typeNumber:8,bitString:"000111",code:"0-0-0-1-1-1",typeName:"숙고·자율·구체·분석·공감·원칙형",personaName:"믿음을 새기는 설계자",energySignature:"숙고 × 자율 × 구체 × 분석 × 공감 × 원칙",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 아이디어를 실제 모습으로 만듭니다. 하나씩 따져보고, 마음을 살피며 정한 기준을 지킵니다.",preferredEnergies:["숙고","자율","구체","분석","공감","원칙"],supportingEnergies:["추진","조율","창의","통합","명료","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:1,preferredEnergy:"분석",supportingEnergy:"통합",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:1,preferredEnergy:"공감",supportingEnergy:"명료",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 아이디어와 목표를 실제 조건에 맞는 결과물로 만들어 갑니다. 정보를 나누고 근거를 비교해 문제가 어떻게 얽혀 있는지 선명하게 봅니다. 상대의 감정과 필요를 세심하게 읽습니다. 그래서 사람들이 마음 놓고 이야기할 수 있는 분위기가 만들어집니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 근거와 기준을 함께 쓰기 때문에 잘못이 적고 반복할 수 있는 판단과 운영 방식을 만드는 데 강점이 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 구체, 분석, 공감, 원칙입니다. ‘믿음을 새기는 설계자’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","막연한 요구를 실제 일정과 자원, 순서, 결과물로 바꿉니다. 바로 실행할 수 있는 형태가 만들어집니다.","사실과 가정, 원인을 구분하고 자료를 비교합니다. 판단이 정확해지고 다른 사람에게 설명하기도 쉬워집니다.","말의 내용과 감정, 분위기를 함께 살펴 상대가 충분히 이해받는다고 느끼도록 반응합니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다.","자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다.","근거와 기준을 함께 쓰기 때문에 잘못이 적고 반복할 수 있는 판단과 운영 방식을 만드는 데 강점이 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 목표가 실제로 어떤 모습이 될지 필요한 자원과 단계, 완성된 모습을 먼저 그려 보는 편입니다. 복잡한 문제를 부분으로 나누고 판단 기준과 근거를 정리한 뒤 다가가는 편입니다. 사람마다 받아들이는 속도와 마음의 부담을 헤아려 협력이 이어지도록 관계를 살피는 편입니다. 일정과 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 마무리하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 자료와 조건, 위험, 원인과 결과의 연결을 비교해 판단합니다. 결정이 사람에게 미칠 경험과 감정적 영향을 함께 고려합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 충분히 듣고 감정을 확인하며 상대가 편하게 자신을 표현할 수 있는 분위기를 만듭니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","분석 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","공감 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 구체의 사고 접근을 자연스럽게 더합니다. 판단은 분석, 관계는 공감, 운영은 원칙의 방식으로 일관되게 이어 갑니다. 현실적인 조건을 세심하게 살핀 뒤 안정적으로 실행 가능한 계획을 만드는 데 강점이 있습니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","아이디어를 실제 과정과 결과물로 만들어야 하는 실무 과제","복잡한 정보와 원인을 나누어 정리하고 확인해야 하는 문제 해결 과제","사람의 경험, 관계, 수용성이 결과의 질에 중요한 과제","일정, 품질, 기준과 책임을 안정적으로 관리해야 하는 운영 과제"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","분석이 지나치면 숫자로 설명하기 어려운 분위기나 전체 흐름을 놓칠 수 있습니다. 판단에 걸리는 시간도 길어집니다.","공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다.","원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 지금 조건 너머의 다른 방법과 가능성을 열어 줍니다. 현실적인 계획에 새로운 선택지가 더해집니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.",matureStrength:"현실감을 지키면서 새로운 대안을 받아들여 더 나은 형태로 만들어 내는 힘"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 낱낱의 정보가 전체 속에서 어떤 뜻을 갖는지 이어 줍니다. 분석한 결과가 전체 목표와 연결됩니다.",overuseSignal:"분석이 지나치면 숫자로 설명하기 어려운 분위기나 전체 흐름을 놓칠 수 있습니다. 판단에 걸리는 시간도 길어집니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 뜻하는가”를 한 문장으로 다시 정리하면 도움이 됩니다.",matureStrength:"정확한 근거와 전체 흐름을 함께 잇는 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료함은 상대를 배려하면서도 자신의 생각과 기대, 선을 분명히 전하게 합니다. 공감에 건강한 경계가 더해집니다.",overuseSignal:"공감이 지나치면 상대의 감정과 필요를 앞세우게 됩니다. 그러다 자신의 의견이나 꼭 필요한 말을 늦게 꺼낼 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현하는 것이 도움이 됩니다.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연함은 핵심 기준을 지키면서 방법과 순서를 현실에 맞게 바꾸게 해 줍니다. 원칙에 적응하는 힘이 더해집니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 나누어 두면 도움이 됩니다.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 공감에 명료를, 운영에서는 원칙에 유연을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","구체 에너지를 지나치게 쓰고 있다고 느껴지면 창의 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 실행안을 정하기 전에 지금 방식과 다른 대안 두 가지를 일부러 적어 보고 비교하면 좋습니다.","공감 에너지를 지나치게 쓰고 있다고 느껴지면 명료 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현하는 것이 도움이 됩니다.","원칙 에너지를 지나치게 쓰고 있다고 느껴지면 유연 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 나누어 두면 도움이 됩니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 구체와 창의 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료를 더하면 전달과 이해가 더 좋아지는가?","지금의 원칙 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 구체, 분석, 공감, 원칙 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 창의, 통합, 명료, 유연 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-0-1-1-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 구체 × 분석 × 공감 × 원칙” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다.",legacyPersonaName:"세심한 신뢰 설계자"},{typeNumber:9,bitString:"001000",code:"0-0-1-0-0-0",typeName:"숙고·자율·창의·통합·명료·유연형",personaName:"자유로운 상상력의 연금술사",energySignature:"숙고 × 자율 × 창의 × 통합 × 명료 × 유연",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 다른 길을 떠올립니다. 전체를 이어 보고, 생각을 분명히 말하고 상황에 맞게 바꿉니다.",preferredEnergies:["숙고","자율","창의","통합","명료","유연"],supportingEnergies:["추진","조율","구체","분석","공감","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식 속에서도 새로운 길과 다른 방법을 찾아냅니다. 여러 정보를 앞뒤 상황과 이어 보며 전체 그림을 읽습니다. 생각과 기준을 분명한 말로 표현합니다. 그래서 관계와 일에서 애매한 부분이 줄어듭니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 여러 가능성을 충분히 살펴본 뒤 고르기 때문에 아이디어 선택의 완성도가 높습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 전체 흐름의 변화를 빠르게 읽고 방법을 조정합니다. 복잡한 상황에서도 자연스럽게 방향을 바꿀 수 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 창의, 통합, 명료, 유연입니다. ‘자유로운 상상력의 연금술사’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","흩어진 신호를 앞뒤 상황과 이어 봅니다. 큰 흐름과 핵심 의미를 빠르게 잡아냅니다.","핵심 메시지와 기대 수준을 분명하게 전달합니다. 오해가 줄고 판단도 빨라집니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","여러 가능성을 충분히 살펴본 뒤 고르기 때문에 아이디어 선택의 완성도가 높습니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","전체 흐름의 변화를 빠르게 읽고 방법을 조정합니다. 복잡한 상황에서도 자연스럽게 방향을 바꿀 수 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 새로운 관점과 대안, 콘셉트를 찾아보는 편입니다. 일 전체의 목적과 관계, 흐름을 먼저 보고 서로 이어지는 지점을 찾는 편입니다. 역할과 해야 할 일, 결론, 다음 행동을 분명한 말로 정리하는 편입니다. 실제 상황에 맞춰 방법과 우선순위를 조정하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 흐름 속에서 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 생각과 기대를 직접 표현해 서로 짐작해야 하는 부분을 줄이는 편입니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 창의의 사고 접근을 자연스럽게 더합니다. 판단은 통합, 관계는 명료, 운영은 유연의 방식으로 일관되게 이어 갑니다. 여러 가능성을 충분히 살펴본 뒤 고르기 때문에 아이디어 선택의 완성도가 높습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 회의, 아이디어 찾기, 결정, 실행, 되돌아보기 단계마다 필요한 보완 에너지를 골라 더하면 팀에 보태는 힘이 더 커집니다.",goodFitSituations:["복잡한 영향과 위험을 미리 살펴야 하는 중요한 판단","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","해야 할 일과 책임, 결정 사항을 분명하게 정리해야 하는 상황","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","새로운 가능성을 계속 넓히다 보면 지금 중요한 한 가지를 고르고 완성하는 시점이 늦어질 수 있습니다.","전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.","유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.","여기 적힌 내용은 강점을 쓰는 세기를 조절할 시점을 알려주는 신호입니다. 보완 에너지를 잠깐 꺼내 쓰는 것만으로도 균형을 되찾을 수 있습니다."],developmentGuide:[{primaryEnergy:"숙고",supportEnergy:"추진",whyItHelps:"추진은 판단이 충분해진 순간 생각을 행동으로 옮겨 줍니다. 깊이 살핀 것이 실행으로 이어집니다.",overuseSignal:"숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.",practice:"살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",matureStrength:"깊이 살피되 필요한 시점에는 결정을 행동으로 전환하는 신중한 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 혼자 내린 판단을 함께하는 목표와 이어 줍니다. 다른 사람의 정보와 참여를 쓸 수 있게 됩니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 생각이나 필요한 정보를 먼저 물어보는 것이 도움이 됩니다.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 여러 가능성 가운데 실행할 하나를 고르게 해 줍니다. 일정과 자원, 결과물의 모습으로 현실이 됩니다.",overuseSignal:"새로운 가능성을 계속 넓히다 보면 지금 중요한 한 가지를 고르고 완성하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행할 수 있는지, 효과가 있는지, 비용이 맞는지 세 가지로 하나를 고릅니다. 고른 하나를 작은 결과물로 완성하는 것이 좋습니다.",matureStrength:"가능성을 넓힌 뒤 현실적인 하나를 골라 완성까지 잇는 창의력"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 크게 잡은 흐름을 근거와 순서로 확인해 줍니다. 다른 사람도 같은 결론에 이를 수 있게 됩니다.",overuseSignal:"전체 흐름을 감으로 빠르게 이해하는 편입니다. 그 뒤에 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤에는 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 두면 도움이 됩니다.",matureStrength:"큰 그림을 보면서도 필요한 근거와 짜임새를 분명히 제시하는 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 말도 상대의 상태와 관계의 흐름에 맞게 전하도록 도와줍니다. 분명한 말이 더 잘 받아들여집니다.",overuseSignal:"명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다.",practice:"중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.",matureStrength:"핵심을 분명히 전하면서도 상대가 받아들일 수 있는 방식으로 맞추는 소통력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 지켜 줍니다. 유연함에 흔들리지 않는 중심이 생깁니다.",overuseSignal:"유연함이 지나치면 기준이나 우선순위가 자주 바뀔 수 있습니다. 주변에서는 다음 기준을 짐작하기 어려워집니다.",practice:"상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"숙고의 반대편인 추진 에너지를 오늘 하루 한 번만 의식해서 써 보는 것으로 충분합니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.",next30Days:"4주 동안은 행동, 관계, 운영 세 축을 매주 하나씩 연습합니다. 행동에서는 숙고에 추진을, 관계에서는 명료에 공감을, 운영에서는 유연에 원칙을 조금씩 더해 보는 연습입니다. 자연스러운 에너지를 누를 필요는 없습니다. 보완 에너지를 더했을 때 결과가 좋아진 장면을 기록해 두면 도움이 됩니다.",longTerm:"길게 보면 방향은 하나입니다. 자신의 기본 선호는 그대로 둡니다. 그 위에서 여섯 축의 보완 에너지를 필요할 때 꺼내 쓰는 폭을 넓혀 가면 됩니다. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 경우의 수를 더 검토하며 착수와 결정을 늦출 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["숙고 에너지를 지나치게 쓰고 있다고 느껴지면 추진 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 살펴볼 시간을 미리 정해 두는 방법이 있습니다. 시간이 끝나면 가장 작은 다음 행동 하나를 바로 시작하는 것이 도움이 됩니다.","창의 에너지를 지나치게 쓰고 있다고 느껴지면 구체 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 아이디어를 세 개까지 만든 뒤 실행할 수 있는지, 효과가 있는지, 비용이 맞는지 세 가지로 하나를 고릅니다. 고른 하나를 작은 결과물로 완성하는 것이 좋습니다.","명료 에너지를 지나치게 쓰고 있다고 느껴지면 공감 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 중요한 말을 하기 전에 상대가 지금 어떤 상태인지 한 번 확인하는 것이 좋습니다. 결론과 함께 이유를 짧게 덧붙이면 전달이 부드러워집니다.","유연 에너지를 지나치게 쓰고 있다고 느껴지면 원칙 에너지를 잠깐 꺼내 쓰는 것이 도움이 됩니다. 상황에 맞춰 바꾸기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인하면 중심이 흔들리지 않습니다."],selfCoachingQuestions:["나는 지금 숙고 에너지를 자연스럽게 쓰고 있는가? 반대편인 추진 에너지를 조금 더하면 무엇이 좋아지는가?","이 일에서는 창의와 구체 가운데 어느 쪽을 더 쓰면 결과가 좋아지는가?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 더하면 전달과 이해가 더 좋아지는가?","지금의 유연 운영 방식에서 반드시 지킬 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 숙고, 자율, 창의, 통합, 명료, 유연 에너지를 더 자연스럽게 고릅니다. 이 조합 자체가 하나의 완성된 모습입니다. 반대편의 추진, 조율, 구체, 분석, 공감, 원칙 에너지도 필요할 때 함께 쓸 수 있습니다. 성장의 방향은 지금의 강점을 살리면서, 상황에 따라 보완 에너지를 고를 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 0-0-1-0-0-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “숙고 × 자율 × 창의 × 통합 × 명료 × 유연” 에너지 서명을 중심으로 표시합니다. 모든 사람은 12가지 에너지를 모두 가지고 있습니다. 점수는 우열이 아니라 평소 어느 쪽을 더 자주 쓰는지를 보여줄 뿐입니다. 반대편 에너지도 필요할 때 쓸 수 있습니다. 유형 이름은 전체 모습을 간단히 보여주는 요약입니다. 같은 유형이라도 실제 선호의 정도는 사람마다 다릅니다. 그래서 여섯 쌍의 점수를 함께 보여드립니다.",legacyPersonaName:"자유로운 가능성 발굴자"},{typeNumber:10,bitString:"001001",code:"0-0-1-0-0-1",typeName:"숙고·자율·창의·통합·명료·원칙형",personaName:"아이디어 구현 설계자",energySignature:"숙고 × 자율 × 창의 × 통합 × 명료 × 원칙",headline:"충분히 살핀 뒤 움직이고, 스스로 판단해 끌고 가며 다른 길을 떠올립니다. 전체를 이어 보고, 생각을 분명히 말하고 정한 기준을 지킵니다.",preferredEnergies:["숙고","자율","창의","통합","명료","원칙"],supportingEnergies:["추진","조율","구체","분석","공감","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:0,preferredEnergy:"숙고",supportingEnergy:"추진",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"조건과 영향을 충분히 살핀 뒤 움직입니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식 속에서도 새로운 길과 다른 방법을 찾아냅니다. 여러 정보를 앞뒤 상황과 이어 보며 전체 그림을 읽습니다. 생각과 기준을 분명한 말로 표현합니다. 그래서 관계와 일에서 애매한 부분이 줄어듭니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 여러 가능성을 충분히 살펴본 뒤 고르기 때문에 아이디어 선택의 완성도가 높습니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 전체 흐름과 핵심 기준, 약속을 함께 살핍니다. 큰 방향과 안정감을 동시에 지킬 수 있습니다. 이런 모습을 만드는 여섯 에너지가 숙고, 자율, 창의, 통합, 명료, 원칙입니다. ‘아이디어 구현 설계자’라는 이름은 이 조합에서 나온 별칭입니다. 이 결과는 여섯 가지 상황에서 두 에너지 가운데 어느 쪽을 평소 더 자연스럽게 쓰는지를 보여줍니다. 반대편의 보완 에너지는 지금의 강점을 받쳐주는 또 하나의 힘입니다. 성장의 목표는 지금의 자연스러운 에너지를 그대로 살리는 데서 출발합니다. 여기에 필요할 때 보완 에너지를 꺼내 쓰는 폭을 넓히면 됩니다.",strengths:["중요한 변수와 결과를 미리 살펴 시행착오를 줄입니다.","필요한 판단을 스스로 내리고 맡은 범위 안에서 집중을 유지합니다. 일의 속도와 선명함이 높아집니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","흩어진 신호를 앞뒤 상황과 이어 봅니다. 큰 흐름과 핵심 의미를 빠르게 잡아냅니다.","핵심 메시지와 기대 수준을 분명하게 전달합니다. 오해가 줄고 판단도 빨라집니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","여러 가능성을 충분히 살펴본 뒤 고르기 때문에 아이디어 선택의 완성도가 높습니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","전체 흐름과 핵심 기준, 약속을 함께 살핍니다. 큰 방향과 안정감을 동시에 지킬 수 있습니다."],workStyle:"일할 때는 일의 목적과 조건을 이해하고 판단이 정리된 뒤에 차분히 시작하는 편입니다. 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 정해 진행하는 편입니다. 새로운 관점과 대안, 콘셉트를 찾아보는 편입니다. 일 전체의 목적과 관계, 흐름을 먼저 보고 서로 이어지는 지점을 찾는 편입니다. 역할과 해야 할 일, 결론, 다음 행동을 분명한 말로 정리하는 편입니다. 일정과 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 마무리하는 편입니다. 일의 단계에 따라 주로 쓸 에너지를 고르면 피로가 줄고 강점의 질이 높아집니다.",decisionStyle:"결정이 미칠 영향과 되돌리기 어려운 지점을 살핀 뒤 선택하는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 흐름 속에서 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"사람들과 함께할 때는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 지키는 편입니다. 생각과 기대를 직접 표현해 서로 짐작해야 하는 부분을 줄이는 편입니다. 상황과 상대의 의도를 충분히 읽은 뒤에 표현하는 편입니다. 상대가 원하는 소통의 속도와 방식을 확인하면 자신의 관계 강점을 더 안정적으로 쓸 수 있습니다.",collaborationGuide:{worksWellWhen:["숙고 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어를 찾는 일과 다듬는 일의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 앞뒤 상황을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["숙고가 과도해지면 충분한 정보가 모일 때까지 시작을 미루거나 결정 시점을 놓칠 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 지나치면 내용의 정확함에만 집중할 수 있습니다. 그 사이 상대가 받아들이는 속도나 표현의 온도를 놓치기 쉽습니다."],bestFeedbackStyle:"잘된 행동을 먼저 구체적으로 짚어 주는 피드백이 잘 맞습니다. 그다음 추진 에너지를 한 번 더 써 보도록 제안하면 받아들이기 쉽습니다. 피드백의 초점은 “보완 에너지를 언제 더하면 결과가 좋아지는가”에 두는 것이 좋습니다. 지금의 강점을 살린다는 전제 위에서, 구체적인 행동으로 짚어 주면 가장 도움이 됩니다."},teamContribution:"팀에서는 숙고의 행동 리듬과 자율의 협업 방식, 창의의 사고 접근을 자연스럽게 더합니다. 판단은 통합, 관계는 명료, 운영은 원칙의 방식으로 일관되게 이어 갑니다.
