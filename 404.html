외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 현재 조건을 넘어 다른 접근과 가능성을 열어 구체성에 새로운 선택지를 더합니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 확정하기 전에 기존 방식과 다른 대안 두 가지를 의도적으로 적어 본 뒤 비교하세요.",matureStrength:"현실성을 유지하면서 새로운 대안을 받아들여 더 나은 형태로 구현하는 구체화 능력"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 개별 정보가 전체 맥락에서 어떤 의미를 갖는지 연결해 분석 결과를 전체 목표와 이어줍니다.",overuseSignal:"분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 의미하는가?”를 한 문장으로 다시 정리해 보세요.",matureStrength:"정확한 근거와 전체 맥락을 함께 연결하는 구조적 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료는 상대를 배려하면서 자신의 생각, 기대, 경계를 분명히 전달해 공감에 건강한 경계와 전달력을 더합니다.",overuseSignal:"공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연은 핵심 기준을 유지하면서 방법과 순서를 현실에 맞게 조정해 원칙에 적응력을 더합니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(공감↔명료), 운영(원칙↔유연) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","구체 에너지가 과도하게 사용되고 있다고 느껴지면 창의 에너지를 한 번 호출해 보세요. 실행안을 확정하기 전에 기존 방식과 다른 대안 두 가지를 의도적으로 적어 본 뒤 비교하세요.","공감 에너지가 과도하게 사용되고 있다고 느껴지면 명료 에너지를 한 번 호출해 보세요. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.","원칙 에너지가 과도하게 사용되고 있다고 느껴지면 유연 에너지를 한 번 호출해 보세요. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 구체 방식과 창의 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료을 추가하면 전달이나 이해가 더 좋아질까?","현재의 원칙 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 구체 · 분석 · 공감 · 원칙 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 창의 · 통합 · 명료 · 유연 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-0-1-1-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 구체 × 분석 × 공감 × 원칙” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:41,bitString:"101000",code:"1-0-1-0-0-0",typeName:"추진·자율·창의·통합·명료·유연형",personaName:"빠른 혁신 개척자",energySignature:"추진 × 자율 × 창의 × 통합 × 명료 × 유연",headline:"빠르게 움직이고 새로운 가능성을 넓히고 전체 맥락을 연결해 보며 생각을 분명하게 전하고 상황에 맞게 방법을 조정하는 유형",preferredEnergies:["추진","자율","창의","통합","명료","유연"],supportingEnergies:["숙고","조율","구체","분석","공감","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"‘빠른 혁신 개척자’의 에너지 서명은 추진 · 자율 · 창의 · 통합 · 명료 · 유연입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식에서 새로운 가능성과 대안을 발견합니다. 여러 정보와 맥락을 연결해 전체 그림과 의미를 파악합니다. 생각과 기준을 분명한 언어로 표현해 관계와 과제의 모호함을 줄입니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 전체 맥락의 변화를 빠르게 읽고 방법을 조정해 복잡한 상황에서 자연스럽게 방향을 전환할 수 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","필요한 판단을 스스로 내리고 책임 범위 안에서 집중력을 유지해 업무의 속도와 선명도를 높입니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","부분적으로 흩어진 신호를 관계와 맥락 속에서 연결해 큰 흐름과 핵심 의미를 빠르게 포착합니다.","핵심 메시지와 기대 수준을 분명하게 전달해 오해를 줄이고 의사결정의 속도를 높입니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","전체 맥락의 변화를 빠르게 읽고 방법을 조정해 복잡한 상황에서 자연스럽게 방향을 전환할 수 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 설계해 진행하는 편입니다. 업무에서는 새로운 관점, 대안, 콘셉트를 탐색하는 편입니다. 업무에서는 과제 전체의 목적, 관계, 흐름을 먼저 보고 서로 연결되는 지점을 찾는 편입니다. 업무에서는 역할, 요구사항, 결론, 다음 행동을 분명하게 언어화하는 편입니다. 업무에서는 실제 상황을 반영해 방법과 우선순위를 조정하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 맥락에서 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 유지하는 편입니다. 관계에서는 생각과 기대를 직접 표현하며 서로가 추측해야 하는 영역을 줄이는 편입니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘빠른 혁신 개척자’는 팀에서 추진의 행동 리듬, 자율의 협업 방식, 창의의 사고 접근, 통합의 판단 관점, 명료의 관계 방식, 유연의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","요구사항과 책임, 의사결정을 명확하게 정리해야 하는 상황","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.","전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.","유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 많은 가능성 중 실행할 한 가지를 선택해 일정, 자원, 결과물의 형태로 현실화하도록 받쳐줍니다.",overuseSignal:"가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.",matureStrength:"가능성을 넓힌 뒤 현실적인 한 가지를 선택해 구현까지 연결하는 창의력"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 통합적으로 포착한 흐름을 근거와 구조로 검증해 다른 사람도 이해하고 재현할 수 있게 합니다.",overuseSignal:"전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 보세요.",matureStrength:"큰 그림을 보면서도 필요한 근거와 구조를 명확히 제시하는 통합적 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 메시지도 상대의 상태와 관계 맥락에 맞게 전달해 명료함의 수용성과 영향력을 높여줍니다.",overuseSignal:"명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.",practice:"중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.",matureStrength:"핵심을 분명히 전달하면서도 상대가 받아들일 수 있는 방식으로 조율하는 소통력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 유지해 유연성에 중심과 지속성을 더해줍니다.",overuseSignal:"유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.",practice:"상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(명료↔공감), 운영(유연↔원칙) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","창의 에너지가 과도하게 사용되고 있다고 느껴지면 구체 에너지를 한 번 호출해 보세요. 아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.","명료 에너지가 과도하게 사용되고 있다고 느껴지면 공감 에너지를 한 번 호출해 보세요. 중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.","유연 에너지가 과도하게 사용되고 있다고 느껴지면 원칙 에너지를 한 번 호출해 보세요. 상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 창의 방식과 구체 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 추가하면 전달이나 이해가 더 좋아질까?","현재의 유연 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 창의 · 통합 · 명료 · 유연 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 구체 · 분석 · 공감 · 원칙 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-1-0-0-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 창의 × 통합 × 명료 × 유연” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:42,bitString:"101001",code:"1-0-1-0-0-1",typeName:"추진·자율·창의·통합·명료·원칙형",personaName:"아이디어 완수 창업가",energySignature:"추진 × 자율 × 창의 × 통합 × 명료 × 원칙",headline:"빠르게 움직이고 새로운 가능성을 넓히고 전체 맥락을 연결해 보며 생각을 분명하게 전하고 기준을 일관되게 지키는 유형",preferredEnergies:["추진","자율","창의","통합","명료","원칙"],supportingEnergies:["숙고","조율","구체","분석","공감","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"‘아이디어 완수 창업가’의 에너지 서명은 추진 · 자율 · 창의 · 통합 · 명료 · 원칙입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식에서 새로운 가능성과 대안을 발견합니다. 여러 정보와 맥락을 연결해 전체 그림과 의미를 파악합니다. 생각과 기준을 분명한 언어로 표현해 관계와 과제의 모호함을 줄입니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 전체 흐름과 핵심 기준, 약속을 함께 살펴 큰 방향과 안정성을 동시에 유지할 수 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","필요한 판단을 스스로 내리고 책임 범위 안에서 집중력을 유지해 업무의 속도와 선명도를 높입니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","부분적으로 흩어진 신호를 관계와 맥락 속에서 연결해 큰 흐름과 핵심 의미를 빠르게 포착합니다.","핵심 메시지와 기대 수준을 분명하게 전달해 오해를 줄이고 의사결정의 속도를 높입니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","전체 흐름과 핵심 기준, 약속을 함께 살펴 큰 방향과 안정성을 동시에 유지할 수 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 설계해 진행하는 편입니다. 업무에서는 새로운 관점, 대안, 콘셉트를 탐색하는 편입니다. 업무에서는 과제 전체의 목적, 관계, 흐름을 먼저 보고 서로 연결되는 지점을 찾는 편입니다. 업무에서는 역할, 요구사항, 결론, 다음 행동을 분명하게 언어화하는 편입니다. 업무에서는 일정, 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 완수하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 맥락에서 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 유지하는 편입니다. 관계에서는 생각과 기대를 직접 표현하며 서로가 추측해야 하는 영역을 줄이는 편입니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘아이디어 완수 창업가’는 팀에서 추진의 행동 리듬, 자율의 협업 방식, 창의의 사고 접근, 통합의 판단 관점, 명료의 관계 방식, 원칙의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","요구사항과 책임, 의사결정을 명확하게 정리해야 하는 상황","일정, 품질, 기준과 책임을 안정적으로 관리해야 하는 운영 과제"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.","전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.","원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 많은 가능성 중 실행할 한 가지를 선택해 일정, 자원, 결과물의 형태로 현실화하도록 받쳐줍니다.",overuseSignal:"가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.",matureStrength:"가능성을 넓힌 뒤 현실적인 한 가지를 선택해 구현까지 연결하는 창의력"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 통합적으로 포착한 흐름을 근거와 구조로 검증해 다른 사람도 이해하고 재현할 수 있게 합니다.",overuseSignal:"전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 보세요.",matureStrength:"큰 그림을 보면서도 필요한 근거와 구조를 명확히 제시하는 통합적 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 메시지도 상대의 상태와 관계 맥락에 맞게 전달해 명료함의 수용성과 영향력을 높여줍니다.",overuseSignal:"명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.",practice:"중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.",matureStrength:"핵심을 분명히 전달하면서도 상대가 받아들일 수 있는 방식으로 조율하는 소통력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연은 핵심 기준을 유지하면서 방법과 순서를 현실에 맞게 조정해 원칙에 적응력을 더합니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(명료↔공감), 운영(원칙↔유연) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","창의 에너지가 과도하게 사용되고 있다고 느껴지면 구체 에너지를 한 번 호출해 보세요. 아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.","명료 에너지가 과도하게 사용되고 있다고 느껴지면 공감 에너지를 한 번 호출해 보세요. 중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.","원칙 에너지가 과도하게 사용되고 있다고 느껴지면 유연 에너지를 한 번 호출해 보세요. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 창의 방식과 구체 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 추가하면 전달이나 이해가 더 좋아질까?","현재의 원칙 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 창의 · 통합 · 명료 · 원칙 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 구체 · 분석 · 공감 · 유연 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-1-0-0-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 창의 × 통합 × 명료 × 원칙” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:43,bitString:"101010",code:"1-0-1-0-1-0",typeName:"추진·자율·창의·통합·공감·유연형",personaName:"영감을 행동으로 옮기는 리더",energySignature:"추진 × 자율 × 창의 × 통합 × 공감 × 유연",headline:"빠르게 움직이고 새로운 가능성을 넓히고 전체 맥락을 연결해 보며 사람의 마음을 살피고 상황에 맞게 방법을 조정하는 유형",preferredEnergies:["추진","자율","창의","통합","공감","유연"],supportingEnergies:["숙고","조율","구체","분석","명료","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:1,preferredEnergy:"공감",supportingEnergy:"명료",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"‘영감을 행동으로 옮기는 리더’의 에너지 서명은 추진 · 자율 · 창의 · 통합 · 공감 · 유연입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식에서 새로운 가능성과 대안을 발견합니다. 여러 정보와 맥락을 연결해 전체 그림과 의미를 파악합니다. 상대의 감정과 필요를 세심하게 읽고 관계적 안전감을 만듭니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 전체 맥락의 변화를 빠르게 읽고 방법을 조정해 복잡한 상황에서 자연스럽게 방향을 전환할 수 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","필요한 판단을 스스로 내리고 책임 범위 안에서 집중력을 유지해 업무의 속도와 선명도를 높입니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","부분적으로 흩어진 신호를 관계와 맥락 속에서 연결해 큰 흐름과 핵심 의미를 빠르게 포착합니다.","말의 내용과 감정, 분위기를 함께 살펴 상대가 충분히 이해받는다고 느끼도록 반응합니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다.","자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다.","전체 맥락의 변화를 빠르게 읽고 방법을 조정해 복잡한 상황에서 자연스럽게 방향을 전환할 수 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 설계해 진행하는 편입니다. 업무에서는 새로운 관점, 대안, 콘셉트를 탐색하는 편입니다. 업무에서는 과제 전체의 목적, 관계, 흐름을 먼저 보고 서로 연결되는 지점을 찾는 편입니다. 업무에서는 사람의 수용 속도와 정서적 부담을 고려해 협력이 지속되도록 관계를 관리하는 편입니다. 업무에서는 실제 상황을 반영해 방법과 우선순위를 조정하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 맥락에서 판단합니다. 결정이 사람에게 미칠 경험과 감정적 영향을 함께 고려합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 유지하는 편입니다. 관계에서는 충분히 듣고 감정을 확인하며 상대가 편하게 자신을 표현할 수 있는 분위기를 만듭니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","공감 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘영감을 행동으로 옮기는 리더’는 팀에서 추진의 행동 리듬, 자율의 협업 방식, 창의의 사고 접근, 통합의 판단 관점, 공감의 관계 방식, 유연의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","사람의 경험, 관계, 수용성이 결과의 질에 중요한 과제","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.","전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.","공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.","유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 많은 가능성 중 실행할 한 가지를 선택해 일정, 자원, 결과물의 형태로 현실화하도록 받쳐줍니다.",overuseSignal:"가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.",matureStrength:"가능성을 넓힌 뒤 현실적인 한 가지를 선택해 구현까지 연결하는 창의력"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 통합적으로 포착한 흐름을 근거와 구조로 검증해 다른 사람도 이해하고 재현할 수 있게 합니다.",overuseSignal:"전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 보세요.",matureStrength:"큰 그림을 보면서도 필요한 근거와 구조를 명확히 제시하는 통합적 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료는 상대를 배려하면서 자신의 생각, 기대, 경계를 분명히 전달해 공감에 건강한 경계와 전달력을 더합니다.",overuseSignal:"공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 유지해 유연성에 중심과 지속성을 더해줍니다.",overuseSignal:"유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.",practice:"상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(공감↔명료), 운영(유연↔원칙) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","창의 에너지가 과도하게 사용되고 있다고 느껴지면 구체 에너지를 한 번 호출해 보세요. 아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.","공감 에너지가 과도하게 사용되고 있다고 느껴지면 명료 에너지를 한 번 호출해 보세요. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.","유연 에너지가 과도하게 사용되고 있다고 느껴지면 원칙 에너지를 한 번 호출해 보세요. 상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 창의 방식과 구체 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료을 추가하면 전달이나 이해가 더 좋아질까?","현재의 유연 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 창의 · 통합 · 공감 · 유연 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 구체 · 분석 · 명료 · 원칙 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-1-0-1-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 창의 × 통합 × 공감 × 유연” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:44,bitString:"101011",code:"1-0-1-0-1-1",typeName:"추진·자율·창의·통합·공감·원칙형",personaName:"따뜻한 비전 실현가",energySignature:"추진 × 자율 × 창의 × 통합 × 공감 × 원칙",headline:"빠르게 움직이고 새로운 가능성을 넓히고 전체 맥락을 연결해 보며 사람의 마음을 살피고 기준을 일관되게 지키는 유형",preferredEnergies:["추진","자율","창의","통합","공감","원칙"],supportingEnergies:["숙고","조율","구체","분석","명료","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:1,preferredEnergy:"공감",supportingEnergy:"명료",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"‘따뜻한 비전 실현가’의 에너지 서명은 추진 · 자율 · 창의 · 통합 · 공감 · 원칙입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식에서 새로운 가능성과 대안을 발견합니다. 여러 정보와 맥락을 연결해 전체 그림과 의미를 파악합니다. 상대의 감정과 필요를 세심하게 읽고 관계적 안전감을 만듭니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 전체 흐름과 핵심 기준, 약속을 함께 살펴 큰 방향과 안정성을 동시에 유지할 수 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","필요한 판단을 스스로 내리고 책임 범위 안에서 집중력을 유지해 업무의 속도와 선명도를 높입니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","부분적으로 흩어진 신호를 관계와 맥락 속에서 연결해 큰 흐름과 핵심 의미를 빠르게 포착합니다.","말의 내용과 감정, 분위기를 함께 살펴 상대가 충분히 이해받는다고 느끼도록 반응합니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다.","자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다.","전체 흐름과 핵심 기준, 약속을 함께 살펴 큰 방향과 안정성을 동시에 유지할 수 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 설계해 진행하는 편입니다. 업무에서는 새로운 관점, 대안, 콘셉트를 탐색하는 편입니다. 업무에서는 과제 전체의 목적, 관계, 흐름을 먼저 보고 서로 연결되는 지점을 찾는 편입니다. 업무에서는 사람의 수용 속도와 정서적 부담을 고려해 협력이 지속되도록 관계를 관리하는 편입니다. 업무에서는 일정, 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 완수하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 맥락에서 판단합니다. 결정이 사람에게 미칠 경험과 감정적 영향을 함께 고려합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 유지하는 편입니다. 관계에서는 충분히 듣고 감정을 확인하며 상대가 편하게 자신을 표현할 수 있는 분위기를 만듭니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","공감 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘따뜻한 비전 실현가’는 팀에서 추진의 행동 리듬, 자율의 협업 방식, 창의의 사고 접근, 통합의 판단 관점, 공감의 관계 방식, 원칙의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","사람의 경험, 관계, 수용성이 결과의 질에 중요한 과제","일정, 품질, 기준과 책임을 안정적으로 관리해야 하는 운영 과제"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.","전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.","공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.","원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 많은 가능성 중 실행할 한 가지를 선택해 일정, 자원, 결과물의 형태로 현실화하도록 받쳐줍니다.",overuseSignal:"가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.",matureStrength:"가능성을 넓힌 뒤 현실적인 한 가지를 선택해 구현까지 연결하는 창의력"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 통합적으로 포착한 흐름을 근거와 구조로 검증해 다른 사람도 이해하고 재현할 수 있게 합니다.",overuseSignal:"전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 보세요.",matureStrength:"큰 그림을 보면서도 필요한 근거와 구조를 명확히 제시하는 통합적 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료는 상대를 배려하면서 자신의 생각, 기대, 경계를 분명히 전달해 공감에 건강한 경계와 전달력을 더합니다.",overuseSignal:"공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연은 핵심 기준을 유지하면서 방법과 순서를 현실에 맞게 조정해 원칙에 적응력을 더합니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(공감↔명료), 운영(원칙↔유연) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","창의 에너지가 과도하게 사용되고 있다고 느껴지면 구체 에너지를 한 번 호출해 보세요. 아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.","공감 에너지가 과도하게 사용되고 있다고 느껴지면 명료 에너지를 한 번 호출해 보세요. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.","원칙 에너지가 과도하게 사용되고 있다고 느껴지면 유연 에너지를 한 번 호출해 보세요. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 창의 방식과 구체 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료을 추가하면 전달이나 이해가 더 좋아질까?","현재의 원칙 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 창의 · 통합 · 공감 · 원칙 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 구체 · 분석 · 명료 · 유연 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-1-0-1-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 창의 × 통합 × 공감 × 원칙” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:45,bitString:"101100",code:"1-0-1-1-0-0",typeName:"추진·자율·창의·분석·명료·유연형",personaName:"전략적 혁신가",energySignature:"추진 × 자율 × 창의 × 분석 × 명료 × 유연",headline:"빠르게 움직이고 새로운 가능성을 넓히고 근거를 구조화하며 생각을 분명하게 전하고 상황에 맞게 방법을 조정하는 유형",preferredEnergies:["추진","자율","창의","분석","명료","유연"],supportingEnergies:["숙고","조율","구체","통합","공감","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:1,preferredEnergy:"분석",supportingEnergy:"통합",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"‘전략적 혁신가’의 에너지 서명은 추진 · 자율 · 창의 · 분석 · 명료 · 유연입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식에서 새로운 가능성과 대안을 발견합니다. 정보를 나누고 근거를 비교해 문제의 구조를 선명하게 봅니다. 생각과 기준을 분명한 언어로 표현해 관계와 과제의 모호함을 줄입니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 근거를 확인하면서도 상황 변화에 따라 방법을 수정해 정확성과 적응력을 함께 확보할 수 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","필요한 판단을 스스로 내리고 책임 범위 안에서 집중력을 유지해 업무의 속도와 선명도를 높입니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","사실, 가정, 원인을 구분하고 자료를 비교해 판단의 정확도와 설명 가능성을 높입니다.","핵심 메시지와 기대 수준을 분명하게 전달해 오해를 줄이고 의사결정의 속도를 높입니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","근거를 확인하면서도 상황 변화에 따라 방법을 수정해 정확성과 적응력을 함께 확보할 수 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 설계해 진행하는 편입니다. 업무에서는 새로운 관점, 대안, 콘셉트를 탐색하는 편입니다. 업무에서는 복잡한 문제를 요소로 나누고 판단 기준과 근거를 정리한 뒤 접근하는 편입니다. 업무에서는 역할, 요구사항, 결론, 다음 행동을 분명하게 언어화하는 편입니다. 업무에서는 실제 상황을 반영해 방법과 우선순위를 조정하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 자료, 조건, 위험, 인과관계를 비교해 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 유지하는 편입니다. 관계에서는 생각과 기대를 직접 표현하며 서로가 추측해야 하는 영역을 줄이는 편입니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","분석 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘전략적 혁신가’는 팀에서 추진의 행동 리듬, 자율의 협업 방식, 창의의 사고 접근, 분석의 판단 관점, 명료의 관계 방식, 유연의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","복잡한 정보와 원인을 구조화하고 검증해야 하는 문제 해결 과제","요구사항과 책임, 의사결정을 명확하게 정리해야 하는 상황","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.","분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.","유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 많은 가능성 중 실행할 한 가지를 선택해 일정, 자원, 결과물의 형태로 현실화하도록 받쳐줍니다.",overuseSignal:"가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.",matureStrength:"가능성을 넓힌 뒤 현실적인 한 가지를 선택해 구현까지 연결하는 창의력"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 개별 정보가 전체 맥락에서 어떤 의미를 갖는지 연결해 분석 결과를 전체 목표와 이어줍니다.",overuseSignal:"분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 의미하는가?”를 한 문장으로 다시 정리해 보세요.",matureStrength:"정확한 근거와 전체 맥락을 함께 연결하는 구조적 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 메시지도 상대의 상태와 관계 맥락에 맞게 전달해 명료함의 수용성과 영향력을 높여줍니다.",overuseSignal:"명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.",practice:"중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.",matureStrength:"핵심을 분명히 전달하면서도 상대가 받아들일 수 있는 방식으로 조율하는 소통력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 유지해 유연성에 중심과 지속성을 더해줍니다.",overuseSignal:"유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.",practice:"상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(명료↔공감), 운영(유연↔원칙) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","창의 에너지가 과도하게 사용되고 있다고 느껴지면 구체 에너지를 한 번 호출해 보세요. 아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.","명료 에너지가 과도하게 사용되고 있다고 느껴지면 공감 에너지를 한 번 호출해 보세요. 중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.","유연 에너지가 과도하게 사용되고 있다고 느껴지면 원칙 에너지를 한 번 호출해 보세요. 상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 창의 방식과 구체 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 추가하면 전달이나 이해가 더 좋아질까?","현재의 유연 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 창의 · 분석 · 명료 · 유연 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 구체 · 통합 · 공감 · 원칙 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-1-1-0-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 창의 × 분석 × 명료 × 유연” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:46,bitString:"101101",code:"1-0-1-1-0-1",typeName:"추진·자율·창의·분석·명료·원칙형",personaName:"정교한 혁신 실행가",energySignature:"추진 × 자율 × 창의 × 분석 × 명료 × 원칙",headline:"빠르게 움직이고 새로운 가능성을 넓히고 근거를 구조화하며 생각을 분명하게 전하고 기준을 일관되게 지키는 유형",preferredEnergies:["추진","자율","창의","분석","명료","원칙"],supportingEnergies:["숙고","조율","구체","통합","공감","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:1,preferredEnergy:"분석",supportingEnergy:"통합",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"‘정교한 혁신 실행가’의 에너지 서명은 추진 · 자율 · 창의 · 분석 · 명료 · 원칙입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식에서 새로운 가능성과 대안을 발견합니다. 정보를 나누고 근거를 비교해 문제의 구조를 선명하게 봅니다. 생각과 기준을 분명한 언어로 표현해 관계와 과제의 모호함을 줄입니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 근거와 기준을 결합해 오류가 적고 반복 가능한 판단과 운영 체계를 만드는 데 강점이 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","필요한 판단을 스스로 내리고 책임 범위 안에서 집중력을 유지해 업무의 속도와 선명도를 높입니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","사실, 가정, 원인을 구분하고 자료를 비교해 판단의 정확도와 설명 가능성을 높입니다.","핵심 메시지와 기대 수준을 분명하게 전달해 오해를 줄이고 의사결정의 속도를 높입니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다.","독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다.","근거와 기준을 결합해 오류가 적고 반복 가능한 판단과 운영 체계를 만드는 데 강점이 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 설계해 진행하는 편입니다. 업무에서는 새로운 관점, 대안, 콘셉트를 탐색하는 편입니다. 업무에서는 복잡한 문제를 요소로 나누고 판단 기준과 근거를 정리한 뒤 접근하는 편입니다. 업무에서는 역할, 요구사항, 결론, 다음 행동을 분명하게 언어화하는 편입니다. 업무에서는 일정, 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 완수하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 자료, 조건, 위험, 인과관계를 비교해 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 유지하는 편입니다. 관계에서는 생각과 기대를 직접 표현하며 서로가 추측해야 하는 영역을 줄이는 편입니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","분석 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘정교한 혁신 실행가’는 팀에서 추진의 행동 리듬, 자율의 협업 방식, 창의의 사고 접근, 분석의 판단 관점, 명료의 관계 방식, 원칙의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 독립적으로 판단한 내용을 분명하게 공유해 역할과 책임의 경계를 선명하게 만들 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","복잡한 정보와 원인을 구조화하고 검증해야 하는 문제 해결 과제","요구사항과 책임, 의사결정을 명확하게 정리해야 하는 상황","일정, 품질, 기준과 책임을 안정적으로 관리해야 하는 운영 과제"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.","분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.","원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 많은 가능성 중 실행할 한 가지를 선택해 일정, 자원, 결과물의 형태로 현실화하도록 받쳐줍니다.",overuseSignal:"가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.",matureStrength:"가능성을 넓힌 뒤 현실적인 한 가지를 선택해 구현까지 연결하는 창의력"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 개별 정보가 전체 맥락에서 어떤 의미를 갖는지 연결해 분석 결과를 전체 목표와 이어줍니다.",overuseSignal:"분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 의미하는가?”를 한 문장으로 다시 정리해 보세요.",matureStrength:"정확한 근거와 전체 맥락을 함께 연결하는 구조적 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 메시지도 상대의 상태와 관계 맥락에 맞게 전달해 명료함의 수용성과 영향력을 높여줍니다.",overuseSignal:"명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.",practice:"중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.",matureStrength:"핵심을 분명히 전달하면서도 상대가 받아들일 수 있는 방식으로 조율하는 소통력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연은 핵심 기준을 유지하면서 방법과 순서를 현실에 맞게 조정해 원칙에 적응력을 더합니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(명료↔공감), 운영(원칙↔유연) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","창의 에너지가 과도하게 사용되고 있다고 느껴지면 구체 에너지를 한 번 호출해 보세요. 아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.","명료 에너지가 과도하게 사용되고 있다고 느껴지면 공감 에너지를 한 번 호출해 보세요. 중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.","원칙 에너지가 과도하게 사용되고 있다고 느껴지면 유연 에너지를 한 번 호출해 보세요. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 창의 방식과 구체 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 추가하면 전달이나 이해가 더 좋아질까?","현재의 원칙 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 창의 · 분석 · 명료 · 원칙 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 구체 · 통합 · 공감 · 유연 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-1-1-0-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 창의 × 분석 × 명료 × 원칙” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:47,bitString:"101110",code:"1-0-1-1-1-0",typeName:"추진·자율·창의·분석·공감·유연형",personaName:"인간 중심 혁신 리더",energySignature:"추진 × 자율 × 창의 × 분석 × 공감 × 유연",headline:"빠르게 움직이고 새로운 가능성을 넓히고 근거를 구조화하며 사람의 마음을 살피고 상황에 맞게 방법을 조정하는 유형",preferredEnergies:["추진","자율","창의","분석","공감","유연"],supportingEnergies:["숙고","조율","구체","통합","명료","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:1,preferredEnergy:"분석",supportingEnergy:"통합",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:1,preferredEnergy:"공감",supportingEnergy:"명료",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"‘인간 중심 혁신 리더’의 에너지 서명은 추진 · 자율 · 창의 · 분석 · 공감 · 유연입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식에서 새로운 가능성과 대안을 발견합니다. 정보를 나누고 근거를 비교해 문제의 구조를 선명하게 봅니다. 상대의 감정과 필요를 세심하게 읽고 관계적 안전감을 만듭니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 근거를 확인하면서도 상황 변화에 따라 방법을 수정해 정확성과 적응력을 함께 확보할 수 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","필요한 판단을 스스로 내리고 책임 범위 안에서 집중력을 유지해 업무의 속도와 선명도를 높입니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","사실, 가정, 원인을 구분하고 자료를 비교해 판단의 정확도와 설명 가능성을 높입니다.","말의 내용과 감정, 분위기를 함께 살펴 상대가 충분히 이해받는다고 느끼도록 반응합니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다.","자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다.","근거를 확인하면서도 상황 변화에 따라 방법을 수정해 정확성과 적응력을 함께 확보할 수 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 설계해 진행하는 편입니다. 업무에서는 새로운 관점, 대안, 콘셉트를 탐색하는 편입니다. 업무에서는 복잡한 문제를 요소로 나누고 판단 기준과 근거를 정리한 뒤 접근하는 편입니다. 업무에서는 사람의 수용 속도와 정서적 부담을 고려해 협력이 지속되도록 관계를 관리하는 편입니다. 업무에서는 실제 상황을 반영해 방법과 우선순위를 조정하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 자료, 조건, 위험, 인과관계를 비교해 판단합니다. 결정이 사람에게 미칠 경험과 감정적 영향을 함께 고려합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 유지하는 편입니다. 관계에서는 충분히 듣고 감정을 확인하며 상대가 편하게 자신을 표현할 수 있는 분위기를 만듭니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","분석 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","공감 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘인간 중심 혁신 리더’는 팀에서 추진의 행동 리듬, 자율의 협업 방식, 창의의 사고 접근, 분석의 판단 관점, 공감의 관계 방식, 유연의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","복잡한 정보와 원인을 구조화하고 검증해야 하는 문제 해결 과제","사람의 경험, 관계, 수용성이 결과의 질에 중요한 과제","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.","분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.","공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.","유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 많은 가능성 중 실행할 한 가지를 선택해 일정, 자원, 결과물의 형태로 현실화하도록 받쳐줍니다.",overuseSignal:"가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.",matureStrength:"가능성을 넓힌 뒤 현실적인 한 가지를 선택해 구현까지 연결하는 창의력"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 개별 정보가 전체 맥락에서 어떤 의미를 갖는지 연결해 분석 결과를 전체 목표와 이어줍니다.",overuseSignal:"분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 의미하는가?”를 한 문장으로 다시 정리해 보세요.",matureStrength:"정확한 근거와 전체 맥락을 함께 연결하는 구조적 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료는 상대를 배려하면서 자신의 생각, 기대, 경계를 분명히 전달해 공감에 건강한 경계와 전달력을 더합니다.",overuseSignal:"공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 유지해 유연성에 중심과 지속성을 더해줍니다.",overuseSignal:"유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.",practice:"상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(공감↔명료), 운영(유연↔원칙) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","창의 에너지가 과도하게 사용되고 있다고 느껴지면 구체 에너지를 한 번 호출해 보세요. 아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.","공감 에너지가 과도하게 사용되고 있다고 느껴지면 명료 에너지를 한 번 호출해 보세요. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.","유연 에너지가 과도하게 사용되고 있다고 느껴지면 원칙 에너지를 한 번 호출해 보세요. 상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 창의 방식과 구체 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료을 추가하면 전달이나 이해가 더 좋아질까?","현재의 유연 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 창의 · 분석 · 공감 · 유연 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 구체 · 통합 · 명료 · 원칙 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-1-1-1-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 창의 × 분석 × 공감 × 유연” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:48,bitString:"101111",code:"1-0-1-1-1-1",typeName:"추진·자율·창의·분석·공감·원칙형",personaName:"사람 중심 혁신 완수자",energySignature:"추진 × 자율 × 창의 × 분석 × 공감 × 원칙",headline:"빠르게 움직이고 새로운 가능성을 넓히고 근거를 구조화하며 사람의 마음을 살피고 기준을 일관되게 지키는 유형",preferredEnergies:["추진","자율","창의","분석","공감","원칙"],supportingEnergies:["숙고","조율","구체","통합","명료","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:0,preferredEnergy:"자율",supportingEnergy:"조율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:1,preferredEnergy:"창의",supportingEnergy:"구체",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:1,preferredEnergy:"분석",supportingEnergy:"통합",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:1,preferredEnergy:"공감",supportingEnergy:"명료",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"‘사람 중심 혁신 완수자’의 에너지 서명은 추진 · 자율 · 창의 · 분석 · 공감 · 원칙입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 자기 기준과 책임 영역을 분명히 두고 독립적으로 움직입니다. 익숙한 방식에서 새로운 가능성과 대안을 발견합니다. 정보를 나누고 근거를 비교해 문제의 구조를 선명하게 봅니다. 상대의 감정과 필요를 세심하게 읽고 관계적 안전감을 만듭니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 근거와 기준을 결합해 오류가 적고 반복 가능한 판단과 운영 체계를 만드는 데 강점이 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","필요한 판단을 스스로 내리고 책임 범위 안에서 집중력을 유지해 업무의 속도와 선명도를 높입니다.","서로 다른 정보를 연결해 새로운 아이디어와 가능성을 만들어냅니다.","사실, 가정, 원인을 구분하고 자료를 비교해 판단의 정확도와 설명 가능성을 높입니다.","말의 내용과 감정, 분위기를 함께 살펴 상대가 충분히 이해받는다고 느끼도록 반응합니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다.","자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다.","근거와 기준을 결합해 오류가 적고 반복 가능한 판단과 운영 체계를 만드는 데 강점이 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 역할과 목표가 정해지면 간섭이 적은 환경에서 스스로 방식을 설계해 진행하는 편입니다. 업무에서는 새로운 관점, 대안, 콘셉트를 탐색하는 편입니다. 업무에서는 복잡한 문제를 요소로 나누고 판단 기준과 근거를 정리한 뒤 접근하는 편입니다. 업무에서는 사람의 수용 속도와 정서적 부담을 고려해 협력이 지속되도록 관계를 관리하는 편입니다. 업무에서는 일정, 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 완수하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 새로운 대안과 미래 가능성까지 함께 고려해 선택의 폭을 넓힙니다. 자료, 조건, 위험, 인과관계를 비교해 판단합니다. 결정이 사람에게 미칠 경험과 감정적 영향을 함께 고려합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 자신의 기준과 책임 범위를 우선 확인해 판단하는 방식을 선호합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 서로의 영역과 선택을 존중하며 지나친 개입 없이 신뢰를 유지하는 편입니다. 관계에서는 충분히 듣고 감정을 확인하며 상대가 편하게 자신을 표현할 수 있는 분위기를 만듭니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","자율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","창의 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","분석 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","공감 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘사람 중심 혁신 완수자’는 팀에서 추진의 행동 리듬, 자율의 협업 방식, 창의의 사고 접근, 분석의 판단 관점, 공감의 관계 방식, 원칙의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 새로운 가능성을 발견하면 작은 실험으로 빠르게 확인하는 힘이 생깁니다. 자신의 영역을 지키면서도 상대의 감정을 존중해 과도한 개입 없이 안정적인 관계를 만들 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","개인의 전문성과 판단권이 보장되는 독립적 과제","새로운 콘셉트, 서비스, 콘텐츠, 해결책을 발굴하는 과제","복잡한 정보와 원인을 구조화하고 검증해야 하는 문제 해결 과제","사람의 경험, 관계, 수용성이 결과의 질에 중요한 과제","일정, 품질, 기준과 책임을 안정적으로 관리해야 하는 운영 과제"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.","가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.","분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.","공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.","원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"자율",supportEnergy:"조율",whyItHelps:"조율은 독립적인 판단을 공동 목표와 연결해 다른 사람의 정보와 참여를 활용하도록 도와줍니다.",overuseSignal:"자율성이 과도해지면 충분히 공유하거나 도움을 요청하기 전에 혼자 결정하고 처리할 수 있습니다.",practice:"중요한 결정 전에 영향을 받는 사람 한 명에게 관점이나 필요한 정보를 먼저 물어보세요.",matureStrength:"독립성을 유지하면서 필요한 순간에는 사람과 정보를 연결하는 자율적 협업력"},{primaryEnergy:"창의",supportEnergy:"구체",whyItHelps:"구체는 많은 가능성 중 실행할 한 가지를 선택해 일정, 자원, 결과물의 형태로 현실화하도록 받쳐줍니다.",overuseSignal:"가능성을 계속 넓히면 현재 중요한 한 가지를 선택하고 구체화하는 시점이 늦어질 수 있습니다.",practice:"아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.",matureStrength:"가능성을 넓힌 뒤 현실적인 한 가지를 선택해 구현까지 연결하는 창의력"},{primaryEnergy:"분석",supportEnergy:"통합",whyItHelps:"통합은 개별 정보가 전체 맥락에서 어떤 의미를 갖는지 연결해 분석 결과를 전체 목표와 이어줍니다.",overuseSignal:"분석이 과도해지면 데이터로 설명하기 어려운 맥락이나 전체적인 흐름을 놓치고 판단이 길어질 수 있습니다.",practice:"분석을 마친 뒤 “이 정보들이 전체 상황에서 무엇을 의미하는가?”를 한 문장으로 다시 정리해 보세요.",matureStrength:"정확한 근거와 전체 맥락을 함께 연결하는 구조적 판단력"},{primaryEnergy:"공감",supportEnergy:"명료",whyItHelps:"명료는 상대를 배려하면서 자신의 생각, 기대, 경계를 분명히 전달해 공감에 건강한 경계와 전달력을 더합니다.",overuseSignal:"공감이 과도해지면 상대의 감정과 필요를 우선하다 자신의 의견이나 필요한 메시지를 늦게 표현할 수 있습니다.",practice:"상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.",matureStrength:"상대를 이해하면서도 필요한 말과 경계를 분명히 전하는 따뜻한 관계력"},{primaryEnergy:"원칙",supportEnergy:"유연",whyItHelps:"유연은 핵심 기준을 유지하면서 방법과 순서를 현실에 맞게 조정해 원칙에 적응력을 더합니다.",overuseSignal:"원칙을 과도하게 적용하면 상황 변화나 예외적인 필요에 맞춰 기준을 조정해야 할 시점을 놓칠 수 있습니다.",practice:"계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요.",matureStrength:"핵심 기준을 지키면서 현실 변화에 맞게 방법을 조정하는 안정적인 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(공감↔명료), 운영(원칙↔유연) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 협의를 줄이고 자신의 영역 안으로 들어가 혼자 해결하려는 경향이 강해질 수 있습니다.","압박이 커질수록 새로운 아이디어를 계속 추가하며 현재 과제의 초점과 완료 기준을 잃을 수 있습니다.","압박이 커질수록 다른 사람의 감정까지 자신의 책임처럼 받아들이며 정서적 피로가 커질 수 있습니다.","압박이 커질수록 정해진 계획과 기준을 더 강하게 붙잡아 변화에 대한 여유가 줄어들 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","창의 에너지가 과도하게 사용되고 있다고 느껴지면 구체 에너지를 한 번 호출해 보세요. 아이디어를 세 개까지 만든 뒤 실행 가능성, 효과, 비용 세 기준으로 하나를 선택해 작은 결과물로 만들어 보세요.","공감 에너지가 과도하게 사용되고 있다고 느껴지면 명료 에너지를 한 번 호출해 보세요. 상대의 감정을 확인한 뒤 “제가 생각하는 핵심은…”이라는 문장으로 자신의 의견도 한 번 분명히 표현해 보세요.","원칙 에너지가 과도하게 사용되고 있다고 느껴지면 유연 에너지를 한 번 호출해 보세요. 계획을 세울 때 반드시 지킬 기준과 상황에 따라 바꿀 수 있는 방법을 따로 구분해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 창의 방식과 구체 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 공감 에너지는 잘 작동하고 있는가? 명료을 추가하면 전달이나 이해가 더 좋아질까?","현재의 원칙 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 자율 · 창의 · 분석 · 공감 · 원칙 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 조율 · 구체 · 통합 · 명료 · 유연 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-0-1-1-1-1이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 자율 × 창의 × 분석 × 공감 × 원칙” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:49,bitString:"110000",code:"1-1-0-0-0-0",typeName:"추진·조율·구체·통합·명료·유연형",personaName:"협력을 이끄는 추진 리더",energySignature:"추진 × 조율 × 구체 × 통합 × 명료 × 유연",headline:"빠르게 움직이고 현실적인 형태로 구체화하고 전체 맥락을 연결해 보며 생각을 분명하게 전하고 상황에 맞게 방법을 조정하는 유형",preferredEnergies:["추진","조율","구체","통합","명료","유연"],supportingEnergies:["숙고","자율","창의","분석","공감","원칙"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:1,preferredEnergy:"조율",supportingEnergy:"자율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:0,preferredEnergy:"유연",supportingEnergy:"원칙",pair:["원칙","유연"]}],overview:"‘협력을 이끄는 추진 리더’의 에너지 서명은 추진 · 조율 · 구체 · 통합 · 명료 · 유연입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 사람과 의견을 연결해 함께 움직일 접점을 만듭니다. 아이디어와 목표를 현실적인 조건과 결과물로 구체화합니다. 여러 정보와 맥락을 연결해 전체 그림과 의미를 파악합니다. 생각과 기준을 분명한 언어로 표현해 관계와 과제의 모호함을 줄입니다. 상황 변화에 맞춰 방법과 순서를 조정하며 적응합니다. 목표를 실제 행동 단위로 빠르게 바꾸어 실행의 첫 단계를 명확하게 만드는 힘이 생깁니다. 여러 의견을 듣되 공통 목표와 필요한 결론을 분명히 정리해 협의를 실행으로 연결할 수 있습니다. 전체 맥락의 변화를 빠르게 읽고 방법을 조정해 복잡한 상황에서 자연스럽게 방향을 전환할 수 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","서로 다른 관점에서 공통 목표를 찾아 협력이 이어지도록 관계와 역할을 정돈합니다.","추상적인 요구를 실제 일정, 자원, 순서, 결과물로 바꾸어 실행 가능한 형태를 만듭니다.","부분적으로 흩어진 신호를 관계와 맥락 속에서 연결해 큰 흐름과 핵심 의미를 빠르게 포착합니다.","핵심 메시지와 기대 수준을 분명하게 전달해 오해를 줄이고 의사결정의 속도를 높입니다.","예상과 다른 조건이 생기면 상황에 맞는 현실적인 대안을 빠르게 선택합니다.","목표를 실제 행동 단위로 빠르게 바꾸어 실행의 첫 단계를 명확하게 만드는 힘이 생깁니다.","여러 의견을 듣되 공통 목표와 필요한 결론을 분명히 정리해 협의를 실행으로 연결할 수 있습니다.","전체 맥락의 변화를 빠르게 읽고 방법을 조정해 복잡한 상황에서 자연스럽게 방향을 전환할 수 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 관계자의 의견과 역할을 연결하고 모두가 움직일 수 있는 접점을 만드는 편입니다. 업무에서는 목표가 실제로 어떻게 구현될지 필요한 자원과 단계, 완료 모습을 먼저 구체화하는 편입니다. 업무에서는 과제 전체의 목적, 관계, 흐름을 먼저 보고 서로 연결되는 지점을 찾는 편입니다. 업무에서는 역할, 요구사항, 결론, 다음 행동을 분명하게 언어화하는 편입니다. 업무에서는 실제 상황을 반영해 방법과 우선순위를 조정하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 맥락에서 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 새로운 정보와 상황 변화가 생기면 기존 결정을 수정하는 것을 자연스럽게 받아들입니다. 개인의 결론과 함께 결정에 영향을 받는 사람의 관점과 수용 가능성까지 고려합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 의견 차이를 줄이고 서로 편하게 협력할 수 있는 흐름을 만드는 데 강점이 있습니다. 관계에서는 생각과 기대를 직접 표현하며 서로가 추측해야 하는 영역을 줄이는 편입니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","조율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 유연 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","조율을 과도하게 사용하면 자신의 기준이나 필요한 결론을 늦추면서 모두의 동의를 얻으려 할 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다."],bestFeedbackStyle:"먼저 잘 작동한 행동을 구체적으로 짚고, 다음에는 숙고 에너지를 한 번 더 적용해 보도록 제안하는 방식이 효과적입니다. 피드백은 “현재 강점을 살리면서 보완 에너지를 어느 순간에 추가하면 결과가 더 좋아지는가”를 행동 단위로 제시하는 방식이 적합합니다."},teamContribution:"‘협력을 이끄는 추진 리더’는 팀에서 추진의 행동 리듬, 조율의 협업 방식, 구체의 사고 접근, 통합의 판단 관점, 명료의 관계 방식, 유연의 운영 방식을 하나의 일관된 패턴으로 제공합니다. 목표를 실제 행동 단위로 빠르게 바꾸어 실행의 첫 단계를 명확하게 만드는 힘이 생깁니다. 여러 의견을 듣되 공통 목표와 필요한 결론을 분명히 정리해 협의를 실행으로 연결할 수 있습니다. 팀에서는 회의, 탐색, 결정, 실행, 회고 단계마다 필요한 보완 에너지를 선택적으로 더할 때 기여도가 높아집니다.",goodFitSituations:["초기 추진력과 빠른 착수가 필요한 신규 과제","여러 이해관계자의 합의와 역할 연결이 중요한 협업 과제","아이디어를 실제 프로세스와 결과물로 구현해야 하는 실무 과제","여러 부문과 변수를 연결해 전체 방향을 설계해야 하는 복합 과제","요구사항과 책임, 의사결정을 명확하게 정리해야 하는 상황","변화가 잦고 예외 상황에 빠르게 적응해야 하는 환경"],cautions:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","조율을 과도하게 사용하면 자신의 기준이나 필요한 결론을 늦추면서 모두의 동의를 얻으려 할 수 있습니다.","현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.","전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.","명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.","유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.","주의점은 자연스러운 강점의 사용 강도를 조정할 시점을 알려주는 신호입니다. 보완 에너지를 짧게 호출하는 것만으로도 균형을 회복할 수 있습니다."],developmentGuide:[{primaryEnergy:"추진",supportEnergy:"숙고",whyItHelps:"숙고는 중요한 결정에서 방향과 영향을 한 번 더 확인해 추진의 정확도를 높여줍니다.",overuseSignal:"속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.",practice:"중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",matureStrength:"속도를 유지하면서도 필요한 순간에는 숙고를 호출해 방향까지 함께 잡는 실행력"},{primaryEnergy:"조율",supportEnergy:"자율",whyItHelps:"자율은 조율 과정에서도 자신의 판단 기준과 책임 범위를 분명하게 유지하도록 받쳐줍니다.",overuseSignal:"조율을 과도하게 사용하면 자신의 기준이나 필요한 결론을 늦추면서 모두의 동의를 얻으려 할 수 있습니다.",practice:"협의 전에 내가 지킬 기준 한 가지와 양보 가능한 부분 한 가지를 먼저 적어 보세요.",matureStrength:"사람을 연결하면서 자신의 기준과 책임을 안정적으로 유지하는 협력 조정력"},{primaryEnergy:"구체",supportEnergy:"창의",whyItHelps:"창의는 현재 조건을 넘어 다른 접근과 가능성을 열어 구체성에 새로운 선택지를 더합니다.",overuseSignal:"현재 조건을 강하게 기준으로 삼는 상황에서는 초기 단계의 새로운 가능성까지 함께 살피면 선택의 폭이 넓어집니다.",practice:"실행안을 확정하기 전에 기존 방식과 다른 대안 두 가지를 의도적으로 적어 본 뒤 비교하세요.",matureStrength:"현실성을 유지하면서 새로운 대안을 받아들여 더 나은 형태로 구현하는 구체화 능력"},{primaryEnergy:"통합",supportEnergy:"분석",whyItHelps:"분석은 통합적으로 포착한 흐름을 근거와 구조로 검증해 다른 사람도 이해하고 재현할 수 있게 합니다.",overuseSignal:"전체 맥락을 직관적으로 이해한 뒤 세부 근거와 판단 과정을 함께 설명하면 다른 사람도 결론의 흐름을 쉽게 따라올 수 있습니다.",practice:"전체 그림을 정리한 뒤 결론을 뒷받침하는 핵심 근거 세 가지와 확인이 필요한 가정 한 가지를 적어 보세요.",matureStrength:"큰 그림을 보면서도 필요한 근거와 구조를 명확히 제시하는 통합적 판단력"},{primaryEnergy:"명료",supportEnergy:"공감",whyItHelps:"공감은 같은 메시지도 상대의 상태와 관계 맥락에 맞게 전달해 명료함의 수용성과 영향력을 높여줍니다.",overuseSignal:"명료함이 과도해지면 내용의 정확성에 집중하면서 상대가 받아들이는 감정적 속도나 표현의 온도를 놓칠 수 있습니다.",practice:"중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.",matureStrength:"핵심을 분명히 전달하면서도 상대가 받아들일 수 있는 방식으로 조율하는 소통력"},{primaryEnergy:"유연",supportEnergy:"원칙",whyItHelps:"원칙은 변화 속에서도 핵심 기준과 약속을 유지해 유연성에 중심과 지속성을 더해줍니다.",overuseSignal:"유연함이 과도해지면 기준이나 우선순위가 자주 바뀌어 주변에서 일관성을 예측하기 어려울 수 있습니다.",practice:"상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요.",matureStrength:"변화에 빠르게 적응하면서도 핵심 기준과 약속을 유지하는 유연한 운영력"}],developmentRoadmap:{startNow:"추진의 반대편인 숙고 에너지를 오늘 한 번만 의식적으로 사용해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.",next30Days:"4주 동안 행동(추진↔숙고), 관계(명료↔공감), 운영(유연↔원칙) 세 축을 매주 한 가지씩 연습하세요. 자연스러운 에너지를 억제하지 말고, 보완 에너지를 추가했을 때 결과가 좋아진 장면을 기록하세요.",longTerm:"장기적으로는 자신의 기본 선호를 유지하면서 상황을 읽고 여섯 축의 보완 에너지를 필요할 때 활용할 수 있는 행동 레퍼토리를 넓히세요. 성숙한 강점은 자신의 주된 에너지를 살리면서 두 에너지 사이의 선택권을 넓혀가는 상태입니다."},stressSignals:["압박이 커질수록 더 빨리 결정하고 혼자 처리하려는 경향이 강해질 수 있습니다.","압박이 커질수록 갈등을 피하기 위해 자신의 선호를 뒤로 미루거나 조정 역할을 과도하게 맡을 수 있습니다.","압박이 커질수록 검증된 방식과 눈앞의 세부사항에 집중해 더 넓은 대안을 살피기 어려울 수 있습니다.","압박이 커질수록 설명을 짧게 줄이고 결론만 강조해 상대에게 단호하거나 차갑게 전달될 수 있습니다.","압박이 커질수록 당장의 요구에 계속 맞추면서 원래 목표와 약속한 기준을 놓칠 수 있습니다."],recoveryStrategies:["추진 에너지가 과도하게 사용되고 있다고 느껴지면 숙고 에너지를 한 번 호출해 보세요. 중요한 결정 전 목적, 영향, 되돌릴 수 있는지 세 항목을 2분 동안 확인한 뒤 움직여 보세요.","구체 에너지가 과도하게 사용되고 있다고 느껴지면 창의 에너지를 한 번 호출해 보세요. 실행안을 확정하기 전에 기존 방식과 다른 대안 두 가지를 의도적으로 적어 본 뒤 비교하세요.","명료 에너지가 과도하게 사용되고 있다고 느껴지면 공감 에너지를 한 번 호출해 보세요. 중요한 메시지를 말하기 전에 상대가 지금 어떤 상태인지 한 번 확인하고, 결론과 함께 이유를 짧게 설명해 보세요.","유연 에너지가 과도하게 사용되고 있다고 느껴지면 원칙 에너지를 한 번 호출해 보세요. 상황을 바꿔 대응하기 전에 이번 일에서 반드시 지킬 기준 한 가지를 먼저 확인해 보세요."],selfCoachingQuestions:["지금 나는 추진 에너지를 자연스럽게 쓰고 있는데, 반대편인 숙고을 10%만 더하면 무엇이 좋아질까?","이 과제에서는 구체 방식과 창의 관점 중 어느 쪽을 더 활용하면 결과가 좋아질까?","상대와의 관계에서 명료 에너지는 잘 작동하고 있는가? 공감을 추가하면 전달이나 이해가 더 좋아질까?","현재의 유연 운영 방식에서 반드시 유지할 것과 바꿔도 되는 것은 무엇인가?"],encouragement:"당신의 유형은 여섯 축에서 추진 · 조율 · 구체 · 통합 · 명료 · 유연 에너지를 더 자연스럽게 선택하는 하나의 완성된 패턴입니다. 함께 활용할 수 있는 숙고 · 자율 · 창의 · 분석 · 공감 · 원칙 에너지도 상황에 따라 활용할 수 있습니다. 성장의 방향은 현재의 강점을 살리면서 상황에 따라 보완 에너지를 선택할 수 있는 폭을 넓히는 데 있습니다.",interpretationNote:"내부 코드는 1-1-0-0-0-0이며 1은 각 축의 첫 번째 에너지, 0은 두 번째 에너지에 대한 상대적 선호를 뜻합니다. 1과 0은 각각 첫 번째 에너지와 두 번째 에너지의 상대적 선호 방향을 표시합니다. 사용자 화면에서는 “추진 × 조율 × 구체 × 통합 × 명료 × 유연” 에너지 서명을 중심으로 표시합니다. 같은 유형 안에서도 실제 선호 비율은 다를 수 있으므로 여섯 쌍의 연속점수를 함께 제시합니다."},{typeNumber:50,bitString:"110001",code:"1-1-0-0-0-1",typeName:"추진·조율·구체·통합·명료·원칙형",personaName:"안정적 실행 조정자",energySignature:"추진 × 조율 × 구체 × 통합 × 명료 × 원칙",headline:"빠르게 움직이고 현실적인 형태로 구체화하고 전체 맥락을 연결해 보며 생각을 분명하게 전하고 기준을 일관되게 지키는 유형",preferredEnergies:["추진","조율","구체","통합","명료","원칙"],supportingEnergies:["숙고","자율","창의","분석","공감","유연"],axisPreferences:[{axisKey:"action",axisLabel:"행동",bit:1,preferredEnergy:"추진",supportingEnergy:"숙고",pair:["추진","숙고"]},{axisKey:"collaboration",axisLabel:"협업",bit:1,preferredEnergy:"조율",supportingEnergy:"자율",pair:["조율","자율"]},{axisKey:"thinking",axisLabel:"사고",bit:0,preferredEnergy:"구체",supportingEnergy:"창의",pair:["창의","구체"]},{axisKey:"judgment",axisLabel:"판단",bit:0,preferredEnergy:"통합",supportingEnergy:"분석",pair:["분석","통합"]},{axisKey:"relationship",axisLabel:"관계",bit:0,preferredEnergy:"명료",supportingEnergy:"공감",pair:["공감","명료"]},{axisKey:"operation",axisLabel:"운영",bit:1,preferredEnergy:"원칙",supportingEnergy:"유연",pair:["원칙","유연"]}],overview:"‘안정적 실행 조정자’의 에너지 서명은 추진 · 조율 · 구체 · 통합 · 명료 · 원칙입니다. 이 결과는 각 상황 축에서 두 긍정 에너지 가운데 어느 쪽을 평소 더 자연스럽게 사용하는지를 나타냅니다. 생각과 목표를 빠르게 행동으로 전환합니다. 사람과 의견을 연결해 함께 움직일 접점을 만듭니다. 아이디어와 목표를 현실적인 조건과 결과물로 구체화합니다. 여러 정보와 맥락을 연결해 전체 그림과 의미를 파악합니다. 생각과 기준을 분명한 언어로 표현해 관계와 과제의 모호함을 줄입니다. 기준과 약속, 계획을 일관되게 유지해 신뢰와 안정성을 만듭니다. 목표를 실제 행동 단위로 빠르게 바꾸어 실행의 첫 단계를 명확하게 만드는 힘이 생깁니다. 여러 의견을 듣되 공통 목표와 필요한 결론을 분명히 정리해 협의를 실행으로 연결할 수 있습니다. 전체 흐름과 핵심 기준, 약속을 함께 살펴 큰 방향과 안정성을 동시에 유지할 수 있습니다. 보완 에너지는 현재의 강점을 균형 있게 받쳐주는 확장 자원입니다. 성장의 목표는 자신의 자연스러운 에너지를 유지하면서 필요할 때 보완 에너지를 의식적으로 활용할 수 있는 범위를 넓히는 데 있습니다.",strengths:["결정 가능한 시점을 잡고 첫 행동을 만들어 정체된 상황에 속도를 더합니다.","서로 다른 관점에서 공통 목표를 찾아 협력이 이어지도록 관계와 역할을 정돈합니다.","추상적인 요구를 실제 일정, 자원, 순서, 결과물로 바꾸어 실행 가능한 형태를 만듭니다.","부분적으로 흩어진 신호를 관계와 맥락 속에서 연결해 큰 흐름과 핵심 의미를 빠르게 포착합니다.","핵심 메시지와 기대 수준을 분명하게 전달해 오해를 줄이고 의사결정의 속도를 높입니다.","정한 기준과 일정, 책임을 꾸준히 지켜 결과의 예측 가능성과 신뢰도를 높입니다.","목표를 실제 행동 단위로 빠르게 바꾸어 실행의 첫 단계를 명확하게 만드는 힘이 생깁니다.","여러 의견을 듣되 공통 목표와 필요한 결론을 분명히 정리해 협의를 실행으로 연결할 수 있습니다.","전체 흐름과 핵심 기준, 약속을 함께 살펴 큰 방향과 안정성을 동시에 유지할 수 있습니다."],workStyle:"업무에서는 바로 시험할 다음 단계와 책임을 정해 논의를 실행으로 연결하는 편입니다. 업무에서는 관계자의 의견과 역할을 연결하고 모두가 움직일 수 있는 접점을 만드는 편입니다. 업무에서는 목표가 실제로 어떻게 구현될지 필요한 자원과 단계, 완료 모습을 먼저 구체화하는 편입니다. 업무에서는 과제 전체의 목적, 관계, 흐름을 먼저 보고 서로 연결되는 지점을 찾는 편입니다. 업무에서는 역할, 요구사항, 결론, 다음 행동을 분명하게 언어화하는 편입니다. 업무에서는 일정, 절차, 품질 기준과 책임 범위를 분명하게 관리하며 끝까지 완수하는 편입니다. 과제의 단계에 따라 주도 에너지를 선택하면 피로를 줄이고 강점의 질을 높일 수 있습니다.",decisionStyle:"되돌릴 수 있는 결정은 빠르게 내리고 실행 결과에서 다음 정보를 얻는 방식을 선호합니다. 현실적인 조건, 사용 가능한 자원, 현재 실행 가능성을 중심으로 선택지를 비교합니다. 여러 조건이 서로 어떻게 영향을 주는지 전체 맥락에서 판단합니다. 자신이 무엇을 중요하게 보는지 기준을 명확히 하고 결론을 분명하게 표현합니다. 약속한 기준과 장기적인 일관성을 중요하게 고려합니다. 개인의 결론과 함께 결정에 영향을 받는 사람의 관점과 수용 가능성까지 고려합니다. 중요한 결정에서는 현재 선택한 에너지의 보완 관점도 한 번 확인하면 판단의 폭이 넓어집니다.",relationshipStyle:"관계에서는 의견 차이를 줄이고 서로 편하게 협력할 수 있는 흐름을 만드는 데 강점이 있습니다. 관계에서는 생각과 기대를 직접 표현하며 서로가 추측해야 하는 영역을 줄이는 편입니다. 관계에서도 필요한 도움이나 제안을 행동으로 먼저 보여주는 편입니다. 관계에서는 상대가 원하는 소통의 속도와 형태를 확인하면 자신의 관계 강점을 더 안정적으로 활용할 수 있습니다.",collaborationGuide:{worksWellWhen:["추진 에너지를 자연스럽게 사용할 수 있도록 행동의 속도와 결정 범위가 명확할 때","조율 에너지에 맞게 협업 방식과 개인 책임 범위가 존중될 때","구체 에너지에 맞게 아이디어 탐색과 구체화의 기대 수준이 분명할 때","통합 에너지에 필요한 정보와 맥락을 충분히 확인할 수 있을 때","명료 에너지에 맞는 소통 방식이 허용되고, 원칙 에너지에 맞게 운영 기준이나 변경 여지가 명확할 때"],mayStruggleWhen:["속도가 강점으로 과도하게 사용되면 충분히 살펴야 할 조건이나 상대의 준비 속도를 앞설 수 있습니다.","조율을 과
