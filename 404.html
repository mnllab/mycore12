<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>마이코어12 MYCORE12</title>
    <script>
      // 예전 주소나 없는 경로로 들어온 경우 홈으로 보낸다.
      (function () {
        var base = "/mycore12/";
        var rest = location.pathname.slice(base.length);
        var hash = location.hash && location.hash !== "#" ? location.hash : (rest ? "#/" + rest : "");
        location.replace(base + hash);
      })();
    </script>
  </head>
  <body></body>
</html>
